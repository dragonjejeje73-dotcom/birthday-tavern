
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달그늘 — 이름 없는 전시관</title>

<style>
:root {
  --gold: #d8b77e;
  --cream: #f4e7cd;
  --night: #140f1d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--night);
  color: var(--cream);
  font-family: "Malgun Gothic", sans-serif;
}

[hidden] {
  display: none !important;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

#app {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, #382a39, #100d16);
}

.stage {
  position: relative;
  width: min(100vw, 1500px);
  aspect-ratio: 16 / 9;
  max-height: 100dvh;
  overflow: hidden;
  background: #18121c;
}

.scene-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(transparent 45%, #0c0816d9);
  pointer-events: none;
}

.dialogue {
  position: absolute;
  left: 5%;
  right: 5%;
  bottom: 4%;
  background: #130e1de8;
  border: 1px solid #b99a6a;
  border-radius: 12px;
  padding: 18px 24px;
  min-height: 125px;
  cursor: pointer;
}

.dialogue p {
  margin: 0;
  white-space: pre-line;
  line-height: 1.85;
  font-size: clamp(14px, 1.5vw, 20px);
}

.hint {
  display: block;
  text-align: right;
  font-size: 12px;
  color: #c7b69a;
  margin-top: 8px;
}

.hotspot {
  position: absolute;
  transform: translate(-50%, -50%);
  border: 1px solid #f4d99e;
  background: #1a1029e8;
  color: #fff0c9;
  padding: 10px 13px;
  border-radius: 20px;
  box-shadow: 0 0 18px #ffdc7d88;
  white-space: nowrap;
  font-size: clamp(11px, 1.2vw, 16px);
}

.hotspot:hover {
  transform: translate(-50%, -50%) scale(1.08);
  background: #483057;
}

.topbar {
  position: absolute;
  top: 12px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
}

.pill, .action {
  border: 1px solid #cda975;
  background: #25182d;
  color: #ffe8bb;
  border-radius: 8px;
  padding: 10px 16px;
}

.pill:hover, .action:hover {
  background: #48304c;
}

.action:disabled {
  opacity: .5;
  cursor: wait;
}

.gallery-title {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 16px;
  background: #160e20c9;
  border: 1px solid var(--gold);
  border-radius: 30px;
  white-space: nowrap;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: #090611e8;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal {
  width: min(760px, 100%);
  max-height: 94dvh;
  overflow-y: auto;
  background: linear-gradient(150deg, #302039, #1a1223);
  border: 2px solid var(--gold);
  border-radius: 15px;
  padding: 22px;
  position: relative;
  text-align: center;
}

.modal h2 {
  margin: 4px 40px 16px;
  color: #f4d8a2;
}

.modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  border: 0;
  background: none;
  color: white;
  font-size: 28px;
}

.modal-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  line-height: 1.8;
}

.modal-content p {
  margin: 4px 0;
  white-space: pre-line;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 20px;
}

.art {
  width: min(480px, 100%);
  max-height: 42dvh;
  object-fit: contain;
}

.clickable-art {
  cursor: pointer;
  transition: transform .2s ease;
}

.clickable-art:hover {
  transform: scale(1.04);
}

.paper {
  background: #f4e6c7;
  color: #4a3528;
  padding: 24px;
  text-align: left;
  border: 4px double #aa895c;
  border-radius: 7px;
  white-space: pre-line;
  line-height: 2;
  width: 100%;
  font-family: Georgia, "Malgun Gothic", serif;
  animation: ink 1.3s ease both;
}

@keyframes ink {
  from {
    opacity: 0;
    filter: blur(5px);
  }
  to {
    opacity: 1;
    filter: blur(0);
  }
}

/* 열린 선물 상자: 이미지 자체에서 물건 선택 */

.gift-choices {
  position: relative;
  width: min(480px, 100%);
}

.gift-choices img {
  display: block;
  width: 100%;
  height: auto;
}

.gift-click-area {
  position: absolute;
  display: block;
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

/* 마우스로 클릭해도 버튼 모양이 나타나지 않음 */
.gift-click-area:hover {
  background: transparent;
}

/* 키보드 사용자를 위한 포커스 표시 */
.gift-click-area:focus-visible {
  outline: 2px dashed #f4d99e;
  outline-offset: 2px;
}

.tarot-deck {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  width: 100%;
  padding: 16px 0;
}

.tarot-card {
  width: clamp(76px, 15vw, 116px);
  aspect-ratio: 2 / 3;
  border: 3px double var(--gold);
  border-radius: 9px;
  color: #e9ce99;
  background: radial-gradient(circle, #574171, #24172e 75%);
  box-shadow: 0 8px 24px #0008;
  position: relative;
  transition: transform .2s;
}

.tarot-card::before {
  content: "☾ ✦ ☽";
  position: absolute;
  inset: 7px;
  border: 1px solid #b99a64;
  border-radius: 5px;
  display: grid;
  place-items: center;
  font-size: 21px;
}

.tarot-card:hover {
  transform: translateY(-10px);
}

.tarot-reveal {
  width: min(290px, 100%);
  min-height: 310px;
  border: 5px double var(--gold);
  border-radius: 12px;
  background: radial-gradient(circle, #56416d, #1f162b 80%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  padding: 20px;
  animation: flip .6s ease;
}

.tarot-symbol {
  font-size: 70px;
}

.tarot-english {
  font: 14px Georgia, serif;
  letter-spacing: 2px;
  color: #ead2a0;
}

@keyframes flip {
  from {
    opacity: 0;
    transform: rotateY(85deg);
  }
  to {
    opacity: 1;
    transform: rotateY(0);
  }
}

.tarot-result {
  width: min(620px, 100%);
  background: #f4e6c7;
  color: #493428;
  border: 3px double #aa895c;
  border-radius: 8px;
  padding: 24px;
  line-height: 2;
  white-space: pre-line;
}

.field {
  width: 100%;
  padding: 12px;
  border-radius: 7px;
  border: 1px solid #b99a64;
  background: #f8efdc;
  color: #3a2922;
}

.guest-entry {
  width: 100%;
  text-align: left;
  background: #2a2030;
  border: 1px solid #6f5973;
  border-radius: 8px;
  padding: 12px;
  margin: 8px 0;
  overflow-wrap: anywhere;
}

.guest-entry small {
  color: #c6aa81;
}

.guest-list {
  width: 100%;
}

.birthday {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  gap: 18px;
  background: radial-gradient(circle at 50% 30%, #6d4b65, #23172c 70%);
}

.birthday h1 {
  font-size: clamp(30px, 5vw, 72px);
  color: #ffe0a7;
}

.birthday p {
  line-height: 2;
  max-width: 650px;
  white-space: pre-line;
}

.cake {
  font-size: clamp(90px, 13vw, 160px);
  border: 0;
  background: transparent;
  padding: 0;
  line-height: 1.2;
}

.cake:not(:disabled):hover {
  transform: scale(1.06);
}

.cake:disabled {
  cursor: default;
}

.birthday-letter {
  max-width: 650px;
  margin: 12px auto;
  text-align: left;
}

@media(max-width:600px) {
  .stage {
    aspect-ratio: 9 / 16;
    max-height: 100dvh;
  }

  .dialogue {
    left: 3%;
    right: 3%;
    bottom: 3%;
    padding: 13px;
    min-height: 145px;
  }

  .modal {
    padding: 15px;
  }

  .hotspot {
    font-size: 11px;
    padding: 7px;
  }

  .gallery-title {
    top: 55px;
  }

  .tarot-deck {
    gap: 7px;
  }

  .tarot-card {
    width: 17%;
  }

  .birthday {
    padding: 20px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="modalBackdrop" class="modal-backdrop" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
    <h2 id="modalTitle"></h2>
    <div class="modal-content" id="modalContent"></div>
    <div class="actions" id="modalActions"></div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAmWVCV9ULWPsBaz4wTKw-DJG7Xk16BeFw",
  authDomain: "birthday-tavern.firebaseapp.com",
  projectId: "birthday-tavern",
  storageBucket: "birthday-tavern.firebasestorage.app",
  messagingSenderId: "993302107796",
  appId: "1:993302107796:web:3478e6f58cb7cde9a00681",
  measurementId: "G-C7Q3GT9KMM"
};

const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);
const guestbookRef = collection(db, "guestbook");

const $ = id => document.getElementById(id);
const app = $("app");

function node(tag, cls = "", text) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}

function btn(text, fn, cls = "action") {
  const el = node("button", cls, text);
  el.type = "button";
  el.addEventListener("click", fn);
  return el;
}

/* 프롤로그 */

const scenes = [
  {
    image: "prologue_01.png",
    lines: [
      "눈을 뜨자 익숙한 나무 천장이 보인다.",
      "창밖에서는 새들이 아침을 알리고 있다.",
      "…오늘도 평범한 하루의 시작이다."
    ]
  },
  {
    image: "prologue_02.png",
    lines: [
      "오두막을 나와 숲길에 들어섰다.",
      "나뭇잎 사이로 아침 햇살이 흘러내린다.",
      "오늘따라 숲이 조금 더 신비롭게 느껴진다."
    ]
  },
  {
    image: "prologue_03.png",
    lines: [
      "익숙한 길 끝에 따뜻한 불빛이 보인다.",
      "달과 별이 새겨진 간판, 「달그늘」.",
      "언제나처럼 그곳이 나를 기다리고 있다."
    ]
  },
  {
    image: "prologue_04.png",
    lines: [
      "낡은 나무문 앞에 멈춰 섰다.",
      "안쪽에서 희미한 온기와 나무 향이 전해진다.",
      "자, 오늘도 문을 열어 볼까."
    ]
  },
  {
    image: "prologue_05.png",
    lines: [
      "익숙한 술집의 풍경이 눈앞에 펼쳐진다.",
      "창가의 햇살, 정돈된 바, 조용한 테이블들.",
      "그런데… 저 안쪽이 원래 저랬던가?"
    ]
  },
  {
    image: "prologue_06.png",
    lines: [
      "무심코 안쪽으로 발걸음을 옮겼다.",
      "초록색 좌석 옆, 오래된 나무문 하나가 눈에 들어온다.",
      "분명 익숙한 곳인데, 어쩐지 낯설다."
    ]
  },
  {
    image: "prologue_07.png",
    lines: [
      "문 앞에 서자 발걸음이 멎는다.",
      "오래된 나뭇결과 녹슨 손잡이.",
      "…이 문 너머에는 무엇이 있을까?"
    ]
  }
];

let sceneIndex = 0;
let lineIndex = 0;
let screen = "prologue";

function renderScene() {
  screen = "prologue";

  const scene = scenes[sceneIndex];
  app.replaceChildren();

  const stage = node("main", "stage");
  const img = node("img", "scene-img");
  img.src = scene.image;
  img.alt = "달그늘로 향하는 풍경";

  stage.append(img, node("div", "shade"));

  const topbar = node("div", "topbar");
  topbar.append(btn("처음부터", () => {
    sceneIndex = 0;
    lineIndex = 0;
    renderScene();
  }, "pill"));

  stage.append(topbar);

  const dialogue = node("div", "dialogue");
  dialogue.tabIndex = 0;
  dialogue.setAttribute("role", "button");

  dialogue.append(
    node("p", "", scene.lines[lineIndex]),
    node(
      "span",
      "hint",
      sceneIndex === 6 && lineIndex === 2
        ? "클릭하여 창고 문 열기 →"
        : "클릭하여 계속 →"
    )
  );

  dialogue.addEventListener("click", advance);
  dialogue.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      advance();
    }
  });

  stage.append(dialogue);
  app.append(stage);
}

function advance() {
  if (screen !== "prologue") return;

  if (lineIndex < scenes[sceneIndex].lines.length - 1) {
    lineIndex++;
    renderScene();
  } else if (sceneIndex < scenes.length - 1) {
    sceneIndex++;
    lineIndex = 0;
    renderScene();
  } else {
    renderGallery();
  }
}

/* 전시관 */

const exhibits = [
  { id: "invitation", x: 13, y: 74, label: "✉ 초대장" },
  { id: "gift", x: 87, y: 74, label: "🎁 선물 상자" },
  { id: "tarot", x: 27, y: 47, label: "✦ 타로 카드" },
  { id: "guestbook", x: 73, y: 47, label: "📜 방명록" },
  { id: "final", x: 50, y: 25, label: "🚪 마지막 문" }
];

function renderGallery() {
  screen = "gallery";
  app.replaceChildren();

  const stage = node("main", "stage");
  const img = node("img", "scene-img");
  img.src = "museum.png";
  img.alt = "비밀 전시관";

  stage.append(
    img,
    node("div", "gallery-title", "✦ 이름 없는 전시관 ✦")
  );

  for (const item of exhibits) {
    const hotspot = btn(
      item.label,
      () => openExhibit(item.id),
      "hotspot"
    );

    hotspot.style.left = item.x + "%";
    hotspot.style.top = item.y + "%";
    stage.append(hotspot);
  }

  const topbar = node("div", "topbar");
  topbar.append(btn("← 술집으로", () => {
    sceneIndex = 6;
    lineIndex = 0;
    renderScene();
  }, "pill"));

  stage.append(topbar);
  app.append(stage);
}

/* 팝업 */

let stopGuestbookListener = null;

function stopGuestbook() {
  if (stopGuestbookListener) {
    stopGuestbookListener();
    stopGuestbookListener = null;
  }
}

function openModal(title) {
  stopGuestbook();
  $("modalTitle").textContent = title;
  $("modalContent").replaceChildren();
  $("modalActions").replaceChildren();
  $("modalBackdrop").hidden = false;
  document.body.style.overflow = "hidden";
}

function closeModal() {
  stopGuestbook();
  $("modalBackdrop").hidden = true;
  document.body.style.overflow = "";
}

$("modalClose").addEventListener("click", closeModal);

$("modalBackdrop").addEventListener("click", e => {
  if (e.target === $("modalBackdrop")) closeModal();
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("modalBackdrop").hidden) {
    closeModal();
  }
});

function addButton(label, fn) {
  $("modalActions").append(btn(label, fn));
}

function addArt(src, alt) {
  const img = node("img", "art");
  img.src = src;
  img.alt = alt;
  $("modalContent").append(img);
  return img;
}

function addText(text) {
  const p = node("p", "", text);
  $("modalContent").append(p);
  return p;
}

function openExhibit(id) {
  if (id === "invitation") showInvitation(false);
  if (id === "gift") showGift(0);
  if (id === "tarot") renderTarot();
  if (id === "guestbook") showGuestbook();
  if (id === "final") showFinalDoor();
}

/* 초대장 */

const invitation = `친애하는 주인장께.

먼저, 이곳에 도착하신 것을 환영합니다.

평범한 창고 문 너머에 이런 공간이 있을 줄은 예상하지 못하셨겠지요.

혹시 잘못 들어오신 건 아닌지 걱정하고 계신다면, 안심하셔도 좋습니다.

이곳은 처음부터 당신을 기다리고 있었으니까요.

그동안 이 술집에서는 수많은 손님이 문을 열고 들어왔겠지요.

하지만 오늘은 조금 다릅니다.

이번에는 주인장께서 손님이 되어 주셔야겠습니다.

이곳에는 당신을 위해 준비한 몇 가지 작은 전시물이 있습니다.

그중에는 쓸모 있는 것도, 쓸모없는 것도 있을지 모릅니다. 물론 어느 쪽인지는 저희도 장담할 수 없습니다.

다만 한 가지는 약속드리겠습니다.

이 모든 것은 오직 당신을 위해 준비되었습니다.

그러니 너무 서두르지 마시고, 마음이 이끄는 대로 천천히 둘러봐 주세요.

그리고 마지막 문에 도착하셨을 때, 이 초대장의 진짜 의미를 알게 되실 겁니다.

— 이름 없는 전시관의 안내인으로부터 —`;

function showInvitation(open) {
  openModal("EXHIBIT 01 · 비밀 초대장");

  const art = addArt(
    open ? "invitation_open.png" : "invitation_closed.png",
    "초대장"
  );

  art.classList.add("clickable-art");
  art.tabIndex = 0;
  art.setAttribute("role", "button");

  const toggle = () => showInvitation(!open);

  art.addEventListener("click", toggle);
  art.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      toggle();
    }
  });

  if (open) {
    $("modalContent").append(
      node("div", "paper", invitation)
    );
  } else {
    addText(
      "당신을 기다리고 있던 초대장이다.\n" +
      "초대장을 클릭해 펼쳐 보자."
    );
  }

  addButton(
    open ? "초대장 접기" : "초대장 펼치기",
    toggle
  );
  addButton("전시관으로 돌아가기", closeModal);
}

/* 선물 상자 */

/*
  아래 영역 좌표는 gift_open.png 안에서
  편지가 왼쪽, 동전이 오른쪽에 있다는 가정입니다.

  실제 이미지와 위치가 다르면
  left, top, width, height를 조정하세요.
*/
const giftClickRegions = {
  letter: {
    left: "10%",
    top: "40%",
    width: "40%",
    height: "45%"
  },
  coins: {

function createGiftClickArea(label, region, action) {
  const area = document.createElement("button");
  area.type = "button";
  area.className = "gift-click-area";
  area.setAttribute("aria-label", label);

  area.style.left = region.left;
  area.style.top = region.top;
  area.style.width = region.width;
  area.style.height = region.height;

  area.addEventListener("click", action);

  return area;
}

];

const pick = arr => arr[Math.floor(Math.random() * arr.length)];

let lastFortune = "";
let remainingCards = [];

function drawCard() {
  if (!remainingCards.length) {
    remainingCards = tarotCards.map((_, i) => i);
  }

  const n = Math.floor(Math.random() * remainingCards.length);
  const index = remainingCards.splice(n, 1)[0];

  return tarotCards[index];
}

function makeFortune(card) {
  let result = "";

  for (let i = 0; i < 12; i++) {
    const r = Math.random();

    const ending =
      r < .35 ? pick(funny) :
      r < .65 ? pick(warm) :
      r < .85 ? pick(strange) :
      pick(warm) + "\n" + pick(funny);

    result = [
      pick(openings).replaceAll("{theme}", card[3]),
      pick(middles),
      pick(advice),
      ending
    ].join("\n\n");

    if (result !== lastFortune) break;
  }

  lastFortune = result;
  return result;
}

function showGuestbook() {
  openModal("EXHIBIT 04 · 방문객의 방명록");

  addText(
    "달그늘을 방문한 손님들의 이야기를 남기는 곳입니다.\n" +
    "여기에 남긴 축하 메시지는 다른 방문객도 볼 수 있습니다."
  );

  const name = node("input", "field");
  name.placeholder = "이름 또는 별명 (선택)";
  name.maxLength = 30;

  const message = node("textarea", "field");
  message.placeholder = "주인장에게 축하 메시지를 남겨 주세요!";
  message.rows = 4;
  message.maxLength = 500;

  $("modalContent").append(name, message);

  const saveButton = btn(
    "축하 메시지 남기기",
    async () => {
      const nickname = name.value.trim() || "이름 없는 손님";
      const body = message.value.trim();

      if (!body) {
        alert("메시지를 입력해 주세요!");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "저장 중...";

      try {
        await addDoc(guestbookRef, {
          name: nickname,
          message: body,
          createdAt: serverTimestamp()
        });

        name.value = "";
        message.value = "";
        alert("축하 메시지가 저장되었어요!");
      } catch (error) {
        console.error("방명록 저장 실패:", error);

        alert(
          "저장에 실패했어요.\n" +
          "Firebase의 Firestore 보안 규칙을 확인해 주세요."
        );
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "축하 메시지 남기기";
      }
    }
  );

  $("modalContent").append(
    saveButton,
    node("h3", "", "✦ 손님들이 남긴 이야기 ✦")
  );

  const list = node("div", "guest-list");
  list.append(node("p", "", "축하 메시지를 불러오는 중..."));
  $("modalContent").append(list);

  const messagesQuery = query(
    guestbookRef,
    orderBy("createdAt", "desc"),
    limit(100)
  );

  stopGuestbookListener = onSnapshot(
    messagesQuery,
    snapshot => {
      if (!list.isConnected) return;

      list.replaceChildren();

      if (snapshot.empty) {
        list.append(
          node("p", "", "아직 메시지가 없어요. 첫 번째 손님이 되어 주세요!")
        );
        return;
      }

      for (const doc of snapshot.docs) {
        const entry = doc.data();

        const nickname =
          typeof entry.name === "string"
            ? entry.name
            : "이름 없는 손님";

        const body =
          typeof entry.message === "string"
            ? entry.message
            : "";

        const date = entry.createdAt?.toDate
          ? entry.createdAt.toDate().toLocaleString("ko-KR")
          : "방금 전";

        const item = node("div", "guest-entry");

        item.append(
          node("strong", "", nickname),
          node("small", "", " · " + date),
          node("p", "", body)
        );

        list.append(item);
      }
    },
    error => {
      console.error("방명록 불러오기 실패:", error);

      if (list.isConnected) {
        list.replaceChildren(
          node(
            "p",
            "",
            "메시지를 불러오지 못했어요.\n" +
            "Firebase의 Firestore 보안 규칙을 확인해 주세요."
          )
        );
      }
    }
  );

  addButton("전시관으로 돌아가기", closeModal);
}

    "🔑 힌트 : 주인장의 이름과 생일"
  );

  hint.style.color = "#f4d8a2";
  $("modalContent").append(hint);

  const password = node("input", "field");
  password.type = "password";
  password.placeholder = "비밀번호를 입력하세요";
  password.autocomplete = "off";
  password.maxLength = 50;

  $("modalContent").append(password);

  const feedback = node("p", "", "");
  feedback.style.color = "#ffb6b6";
  $("modalContent").append(feedback);

  function unlock() {
    if (password.value === "Mouren1030") {
      closeModal();
      renderBirthday();
    } else {
      feedback.textContent =
        "🔒 비밀번호가 틀렸습니다. 힌트를 다시 확인해 주세요.";
      password.value = "";
      password.focus();
    }
  }

  password.addEventListener("keydown", e => {
    if (e.key === "Enter") unlock();
  });

  addButton("🔓 문 열기", unlock);
  addButton("전시관으로 돌아가기", closeModal);

  password.focus();
}

/* 생일 케이크와 편지 */

const birthdayLetter = `우렌모에게
어땠었어 내가 만든거?
나름 잘 만들었을지 모르겠네 ㅋㅋ
너 생일이라고 해서 축하해주고 싶은데 어떻게 해야 해서 이렇게라도 만들어봐
생일 축하하고 바보야.
너 덕분에 방송보는 그 하루가 너무 재밌는거 같아.
너와 같이 얘기하면서 노는 그 시간이 좋았고
너를 자꾸 기다리는 내 시간이 정말 기다림의 연속이 되는거 같아.
너의 삶에서 오늘의 생일이 어떻게 기록될지 모르겠지만
너에게 가장 행복한 하루였으면 좋겠어
사랑하고 또 사랑해 바보야.`;

function renderBirthday() {
  screen = "birthday";
  app.replaceChildren();

  const stage = node("main", "stage");
  stage.style.overflowY = "auto";
  stage.style.maxHeight = "100dvh";

  const content = node("div", "birthday");
  content.style.minHeight = "100%";
  content.style.height = "auto";

  const cake = btn(
    "🎂",
    revealLetter,
    "cake"
  );

  cake.setAttribute(
    "aria-label",
    "케이크를 눌러 생일 편지 보기"
  );

  const title = node(
    "h1",
    "",
    "생일 축하해, 우렌모!"
  );

  const guide = node(
    "p",
    "",
    "마지막으로 준비한 선물이 하나 더 있어.\n" +
    "케이크를 눌러 봐."
  );

  const letter = node(
    "div",
    "paper birthday-letter",
    birthdayLetter
  );

  letter.hidden = true;

  function revealLetter() {
    letter.hidden = false;
    guide.hidden = true;
    cake.disabled = true;

    requestAnimationFrame(() => {
      letter.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    });
  }

  content.append(
    cake,
    title,
    guide,
    letter,
    btn("전시관으로 돌아가기", renderGallery)
  );

  stage.append(content);
  app.append(stage);
}

/* 시작 */

renderScene();

</script>
