
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달그늘 | 이름 없는 전시관</title>

<style>
:root {
  --gold: #d9b77e;
  --cream: #f8edd9;
  --dark: #17121b;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--dark);
  color: var(--cream);
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .35; cursor: default; }
.hidden { display: none !important; }
.screen {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 18px;
}
.eyebrow {
  color: var(--gold);
  font-size: 12px;
  letter-spacing: .2em;
  text-align: center;
}
.btn {
  padding: 12px 22px;
  color: var(--cream);
  background: #34262a;
  border: 1px solid var(--gold);
  border-radius: 7px;
}
.btn:hover:not(:disabled) { background: #614536; }
.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}
.muted {
  color: #d1baa0;
  font-size: 13px;
  text-align: center;
  line-height: 1.7;
}

/* 프롤로그 */
#prologue {
  background: radial-gradient(circle at 50% 20%, #503a3e, #120e15 75%);
}
.scene-art {
  width: min(1100px, 100%);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border: 1px solid #967552;
  border-radius: 10px;
  background: #151117;
  box-shadow: 0 20px 65px #0009;
}
.scene-art img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  animation: fadeScene .8s ease;
}
@keyframes fadeScene {
  from { opacity: .2; }
  to { opacity: 1; }
}
.dialogue {
  width: min(900px, 100%);
  min-height: 130px;
  padding: 24px;
  display: grid;
  place-items: center;
  text-align: center;
  white-space: pre-line;
  line-height: 2;
  background: #261d23;
  border: 1px solid #816348;
  border-radius: 9px;
  font-size: clamp(15px, 2vw, 19px);
}

/* 전시관 */
#museum { background: #100f17; }
.museum-frame {
  width: min(1200px, 100%);
  position: relative;
  aspect-ratio: 1648 / 928;
  overflow: hidden;
  border: 1px solid #aa916b;
  border-radius: 10px;
}
.museum-frame > img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.hotspot {
  position: absolute;
  transform: translate(-50%, -50%);
  padding: 8px 12px;
  min-width: 90px;
  color: #fff2d7;
  background: #19151dcc;
  border: 1px solid #e8c68b;
  border-radius: 9px;
  box-shadow: 0 0 20px #f1c27c55;
}
.hotspot:hover {
  background: #6c4a38;
  box-shadow: 0 0 30px #ffd28a99;
}
.hotspot span {
  display: block;
  font-size: 22px;
  margin-bottom: 4px;
}
.hotspot.invite { left: 13%; top: 74%; }
.hotspot.gift { left: 87%; top: 74%; }
.hotspot.hourglass { left: 27%; top: 47%; }
.hotspot.guestbook { left: 73%; top: 47%; }
.hotspot.finale { left: 50%; top: 25%; }

/* 팝업 */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: #08070deb;
}
.modal {
  position: relative;
  width: min(850px, 100%);
  max-height: 94dvh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  padding: 20px;
  background: #241d25;
  border: 1px solid var(--gold);
  border-radius: 12px;
}
.modal h2 {
  margin: 0;
  text-align: center;
  color: #f0d3a2;
}
.modal p { line-height: 1.8; text-align: center; }
.modal-image {
  display: block;
  width: min(650px, 100%);
  max-height: 60vh;
  object-fit: contain;
  border-radius: 7px;
}
.close {
  align-self: flex-end;
  padding: 8px 13px;
  background: transparent;
  border: 1px solid #aa906d;
  border-radius: 6px;
  color: white;
}

/* 초대장 */
.invitation-stage {
  position: relative;
  width: min(540px, 100%);
}
.invitation-stage > img {
  display: block;
  width: 100%;
  height: auto;
}
.letter-paper {
  position: absolute;
  left: 12%;
  right: 12%;
  top: 14%;
  bottom: 20%;
  overflow-y: auto;
  padding: 18px;
  color: #4c3629;
  background: #fff7e9f2;
  border: 1px solid #c4a16e;
  border-radius: 4px;
}
.letter-paper h3 {
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 30px;
  color: #9a743e;
  text-align: center;
}
.letter-paper p {
  font-family: "Batang", serif;
  font-size: 14px;
  line-height: 2;
  margin-bottom: 20px;
  word-break: keep-all;
}
.ink {
  opacity: 0;
  filter: blur(4px);
  transform: translateY(5px);
  transition: opacity 1s, filter 1s, transform 1s;
}
.ink.visible {
  opacity: 1;
  filter: none;
  transform: none;
}

/* 선물 상자 */
.gift-stage {
  position: relative;
  width: min(740px, 100%);
}
.gift-stage img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 8px;
}
.gift-object {
  position: absolute;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 12px;
}
.gift-object:hover {
  background: #ffe4a51b;
  border-color: #ffda94;
}
.gift-coins {
  left: 19%; top: 27%; width: 29%; height: 48%;
}
.gift-letter {
  left: 47%; top: 30%; width: 31%; height: 43%;
}
.gift-detail {
  width: min(620px, 100%);
  padding: 30px 22px;
  color: #493527;
  background: #f8eedc;
  border: 3px double #b99865;
  border-radius: 8px;
  text-align: center;
}
.gift-detail h3 { color: #825e32; }
.gift-detail p {
  white-space: pre-line;
  font-family: "Batang", serif;
}

/* 모래시계 */
.hourglass-symbol {
  font-size: 85px;
  filter: drop-shadow(0 0 20px #d8b16b);
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  50% { transform: translateY(-9px); }
}
.fortune-paper {
  width: min(600px, 100%);
  padding: 30px;
  background: #f3e6c9;
  color: #4e372a;
  border: 3px double #ad8858;
  border-radius: 8px;
  text-align: center;
  line-height: 2;
  white-space: pre-line;
}

/* 방명록 */
.book {
  width: min(680px, 100%);
  padding: 25px;
  color: #453023;
  background: #f0e2c4;
  border: 8px solid #6b4933;
  border-radius: 12px;
}
.book h3 { text-align: center; }
.book-entry {
  width: 100%;
  padding: 9px;
  margin: 4px 0;
  text-align: left;
  background: transparent;
  border: 0;
  border-bottom: 1px solid #b69b78;
  color: #453023;
}
.book-entry:hover { background: #e1ccaa; }
.book input, .book textarea {
  display: block;
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border: 1px solid #b59b7d;
  border-radius: 5px;
  background: #fffaf0;
  color: #34251b;
}
.book textarea { min-height: 85px; resize: vertical; }
.book .btn { margin-top: 8px; }
.page-indicator { text-align: center; margin: 12px; }

/* 마지막 공간 */
#birthday {
  background: radial-gradient(circle at 50% 30%, #715073, #221627 65%, #100d16);
  text-align: center;
}
.birthday-card {
  width: min(750px, 100%);
  padding: 50px 25px;
  border: 1px solid var(--gold);
  border-radius: 15px;
  background: #241a2cdd;
}
.cake { font-size: clamp(75px, 15vw, 130px); }
.birthday-card h1 {
  color: #f4d5a0;
  font-size: clamp(30px, 6vw, 55px);
}
.birthday-card p {
  line-height: 2.1;
  font-size: clamp(15px, 2vw, 19px);
  white-space: pre-line;
}

@media (max-width: 650px) {
  .screen { padding: 10px; }
  .scene-art { aspect-ratio: 4 / 3; }
  .dialogue { min-height: 170px; padding: 15px; }
  .hotspot {
    min-width: 0;
    padding: 5px;
    font-size: 10px;
  }
  .hotspot span { font-size: 16px; }
  .letter-paper { padding: 9px; }
  .letter-paper p { font-size: 12px; line-height: 1.7; }
  .modal { padding: 12px; }
}
</style>
</head>

<body>

<!-- 프롤로그 -->
<main id="prologue" class="screen">
  <div class="eyebrow">DALGEUNEUL · PROLOGUE</div>

  <div class="scene-art">
    <img id="sceneImage" src="prologue_01.png" alt="오두막 침실">
  </div>

  <div class="dialogue" id="dialogue"></div>
  <div class="muted" id="sceneCounter">1 / 7</div>

  <div class="actions">
    <button class="btn" id="prevScene">← 이전</button>
    <button class="btn" id="nextScene">다음 →</button>
  </div>
</main>

<!-- 전시관 -->
<section id="museum" class="screen hidden">
  <div class="eyebrow">SECRET EXHIBITION</div>
  <h1>이름 없는 전시관</h1>

  <div class="museum-frame">
    <img src="museum.png" alt="비밀 전시관">

    <button class="hotspot invite" data-exhibit="invite">
      <span>✉</span>초대장
    </button>

    <button class="hotspot gift" data-exhibit="gift">
      <span>🎁</span>선물 상자
    </button>

    <button class="hotspot hourglass" data-exhibit="hourglass">
      <span>⌛</span>모래시계
    </button>

    <button class="hotspot guestbook" data-exhibit="guestbook">
      <span>✒</span>방명록
    </button>

    <button class="hotspot finale" data-exhibit="finale">
      <span>✦</span>마지막 문
    </button>
  </div>

  <p class="muted">전시대 위의 물건을 선택해 주세요.</p>

  <button class="btn" id="returnPrologue">
    ← 창고 문 앞으로
  </button>
</section>

<!-- 생일 축하 공간 -->
<section id="birthday" class="screen hidden">
  <div class="birthday-card">
    <div class="eyebrow">THE FINAL ROOM</div>
    <div class="cake">🎂</div>
    <h1>생일 축하합니다!</h1>
    <p>
      여기까지 와 주셔서 감사합니다.

      사실 이 전시관은 처음부터
      단 한 사람을 위해 준비된 공간이었습니다.

      바로 오늘의 주인장, 당신을 위해서요.

      앞으로도 좋아하는 것을 마음껏 즐기고,
      웃을 일이 더 많아지는 날들이 이어지기를 바랍니다.

      그리고 오늘만큼은
      세상에서 가장 행복한 주인장이 되어 주세요.

      생일 진심으로 축하합니다!
    </p>
    <button class="btn" id="returnMuseum">
      ← 전시관으로 돌아가기
    </button>
  </div>
</section>

<!-- 팝업 -->
<div id="overlay" class="overlay hidden">
  <div class="modal" role="dialog" aria-modal="true"
       aria-labelledby="modalTitle">
    <button class="close" id="closeModal">✕ 닫기</button>
    <div class="eyebrow" id="modalBadge"></div>
    <h2 id="modalTitle"></h2>
    <div id="modalContent" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:15px"></div>
    <div class="actions" id="modalActions"></div>
    <div class="muted" id="modalStatus"></div>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

/* 프롤로그 */

const prologueScenes = [
  {
    image: "prologue_01.png",
    alt: "오두막 침실",
    text: "눈을 뜨자 익숙한 나무 천장이 보인다.\n" +
          "창밖에서는 새들이 아침을 알리고 있다.\n" +
          "…오늘도 평범한 하루의 시작이다."
  },
  {
    image: "prologue_02.png",
    alt: "신비로운 숲길",
    text: "오두막을 나와 숲길에 들어섰다.\n" +
          "나뭇잎 사이로 아침 햇살이 흘러내린다.\n" +
          "오늘따라 숲이 조금 더 신비롭게 느껴진다."
  },
  {
    image: "prologue_03.png",
    alt: "달그늘 술집 외관",
    text: "익숙한 길 끝에 따뜻한 불빛이 보인다.\n" +
          "달과 별이 새겨진 간판, 「달그늘」.\n" +
          "언제나처럼 그곳이 나를 기다리고 있다."
  },
  {
    image: "prologue_04.png",
    alt: "달그늘 술집 입구",
    text: "낡은 나무문 앞에 멈춰 섰다.\n" +
          "안쪽에서 희미한 온기와 나무 향이 전해진다.\n" +
          "자, 오늘도 문을 열어 볼까."
  },
  {
    image: "prologue_05.png",
    alt: "달그늘 술집 내부",
    text: "익숙한 술집의 풍경이 눈앞에 펼쳐진다.\n" +
          "창가의 햇살, 정돈된 바, 조용한 테이블들.\n" +
          "그런데… 저 안쪽이 원래 저랬던가?"
  },
  {
    image: "prologue_06.png",
    alt: "창고 문으로 이동",
    text: "무심코 안쪽으로 발걸음을 옮겼다.\n" +
          "초록색 좌석 옆, 오래된 나무문 하나가 눈에 들어온다.\n" +
          "분명 익숙한 곳인데, 어쩐지 낯설다."
  },
  {
    image: "prologue_07.png",
    alt: "낡은 창고 문",
    text: "문 앞에 서자 발걸음이 멎는다.\n" +
          "오래된 나뭇결과 녹슨 손잡이.\n" +
          "…이 문 너머에는 무엇이 있을까?"
  }
];

let sceneIndex = 0;
let inkTimers = [];
let guestPage = 0;

function showScreen(id) {
  ["prologue", "museum", "birthday"].forEach(name => {
    $(name).classList.toggle("hidden", name !== id);
  });
  window.scrollTo(0, 0);
}

function renderScene() {
  const scene = prologueScenes[sceneIndex];
  $("sceneImage").src = scene.image;
  $("sceneImage").alt = scene.alt;
  $("dialogue").textContent = scene.text;
  $("sceneCounter").textContent =
    `${sceneIndex + 1} / ${prologueScenes.length}`;
  $("prevScene").disabled = sceneIndex === 0;
  $("nextScene").textContent =
    sceneIndex === 6 ? "창고 문 열기 →" : "다음 →";
}

$("nextScene").onclick = () => {
  if (sceneIndex < 6) {
    sceneIndex++;
    renderScene();
  } else {
    showScreen("museum");
  }
};

$("prevScene").onclick = () => {
  if (sceneIndex > 0) {
    sceneIndex--;
    renderScene();
  }
};

$("returnPrologue").onclick = () => {
  sceneIndex = 6;
  renderScene();
  showScreen("prologue");
};

$("returnMuseum").onclick = () => showScreen("museum");

/* 공통 팝업 */

function clearTimers() {
  inkTimers.forEach(clearTimeout);
  inkTimers = [];
}

function clearModal() {
  clearTimers();
  $("modalContent").replaceChildren();
  $("modalActions").replaceChildren();
  $("modalStatus").textContent = "";
}

function closeModal() {
  clearTimers();
  $("overlay").classList.add("hidden");
}

function addButton(label, callback) {
  const button = document.createElement("button");
  button.className = "btn";
  button.textContent = label;
  button.onclick = callback;
  $("modalActions").append(button);
}

function addParagraph(text) {
  const p = document.createElement("p");
  p.textContent = text;
  $("modalContent").append(p);
}

function addImage(filename, alt) {
  const img = document.createElement("img");
  img.src = filename;
  img.alt = alt;
  img.className = "modal-image";
  $("modalContent").append(img);
}

function openExhibit(type) {
  if (type === "finale") {
    closeModal();
    showScreen("birthday");
    return;
  }

  clearModal();
  $("overlay").classList.remove("hidden");

  const titles = {
    invite: ["EXHIBIT 01", "수상한 초대장"],
    gift: ["EXHIBIT 02", "주인장을 위한 선물 상자"],
    hourglass: ["EXHIBIT 03", "운세 모래시계"],
    guestbook: ["EXHIBIT 04", "방명록"]
  };

  $("modalBadge").textContent = titles[type][0];
  $("modalTitle").textContent = titles[type][1];

  if (type === "invite") renderInvitationClosed();
  if (type === "gift") renderGiftClosed();
  if (type === "hourglass") renderHourglass();
  if (type === "guestbook") renderGuestbook();
}

document.querySelectorAll("[data-exhibit]").forEach(button => {
  button.onclick = () => openExhibit(button.dataset.exhibit);
});

$("closeModal").onclick = closeModal;
$("overlay").onclick = event => {
  if (event.target === $("overlay")) closeModal();
};

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeModal();
    return;
  }
  if (!$("overlay").classList.contains("hidden")) return;
  if ($("prologue").classList.contains("hidden")) return;
  if (event.key === "ArrowRight") $("nextScene").click();
  if (event.key === "ArrowLeft") $("prevScene").click();
});

/* 초대장 */

const invitationText = [
  "친애하는 주인장께.",
  "먼저, 이곳에 도착하신 것을 환영합니다.",
  "평범한 창고 문 너머에 이런 공간이 있을 줄은 예상하지 못하셨겠지요.",
  "혹시 잘못 들어오신 건 아닌지 걱정하고 계신다면, 안심하셔도 좋습니다.",
  "이곳은 처음부터 당신을 기다리고 있었으니까요.",
  "그동안 이 술집에서는 수많은 손님이 문을 열고 들어왔겠지요.",
  "하지만 오늘은 조금 다릅니다.",
  "이번에는 주인장께서 손님이 되어 주셔야겠습니다.",
  "이곳에는 당신을 위해 준비한 몇 가지 작은 전시물이 있습니다.",
  "그중에는 쓸모 있는 것도, 쓸모없는 것도 있을지 모릅니다. 물론 어느 쪽인지는 저희도 장담할 수 없습니다.",
  "다만 한 가지는 약속드리겠습니다.",
  "이 모든 것은 오직 당신을 위해 준비되었습니다.",
  "그러니 너무 서두르지 마시고, 마음이 이끄는 대로 천천히 둘러봐 주세요.",
  "그리고 마지막 문에 도착하셨을 때, 이 초대장의 진짜 의미를 알게 되실 겁니다.",
  "— 이름 없는 전시관의 안내인으로부터 —"
];

function renderInvitationClosed() {
  clearModal();
  addImage("invitation_closed.png", "닫힌 초대장");
  addParagraph("검은색 표지 위로 금색 글씨가 반짝인다.");
  addButton("초대장 펼치기", renderInvitationOpen);
  addButton("전시관으로 돌아가기", closeModal);
}

function renderInvitationOpen() {
  clearModal();

  const stage = document.createElement("div");
  stage.className = "invitation-stage";

  const img = document.createElement("img");
  img.src = "invitation_open.png";
  img.alt = "펼쳐진 초대장";

  const paper = document.createElement("div");
  paper.className = "letter-paper";

  const heading = document.createElement("h3");
  heading.textContent = "Invitatio";

/* 방명록 */

const GUEST_KEY = "dalgeuneul_guestbook_v1";
const PAGE_SIZE = 12;

function getEntries() {
  try {
    const entries = JSON.parse(localStorage.getItem(GUEST_KEY) || "[]");
    return Array.isArray(entries) ? entries : [];
  } catch {
    return [];
  }
}

function saveEntries(entries) {
  try {
    localStorage.setItem(GUEST_KEY, JSON.stringify(entries));
    return true;
  } catch {
    return false;
  }
}

function renderGuestbook() {
  clearModal();

  const entries = getEntries();
  const pages = Math.max(1, Math.ceil(entries.length / PAGE_SIZE));
  guestPage = Math.max(0, Math.min(guestPage, pages - 1));

  const book = document.createElement("div");
  book.className = "book";

  const title = document.createElement("h3");
  title.textContent = "방문객의 기록";
  book.append(title);

  const start = guestPage * PAGE_SIZE;
  const pageEntries = entries.slice(start, start + PAGE_SIZE);

  if (pageEntries.length === 0) {
    const empty = document.createElement("p");
    empty.textContent = "아직 이 책에 기록된 이름이 없습니다.";
    book.append(empty);
  }

  pageEntries.forEach(entry => {
    const button = document.createElement("button");
    button.className = "book-entry";
    button.textContent = "✒ " + entry.name;
    button.onclick = () => showGuestMessage(entry);
    book.append(button);
  });

  const indicator = document.createElement("div");
  indicator.className = "page-indicator";
  indicator.textContent = `${guestPage + 1} / ${pages} 페이지`;
  book.append(indicator);

  $("modalContent").append(book);

  addButton("← 이전 페이지", () => {
    guestPage--;
    renderGuestbook();
  });
  $("modalActions").lastElementChild.disabled = guestPage === 0;

  addButton("다음 페이지 →", () => {
    guestPage++;
    renderGuestbook();
  });
  $("modalActions").lastElementChild.disabled = guestPage >= pages - 1;

  addButton("이름 남기기", renderGuestForm);
  addButton("전시관으로 돌아가기", closeModal);

  $("modalStatus").textContent =
    "현재는 같은 브라우저에서만 기록이 보입니다.";
}

function showGuestMessage(entry) {
  clearModal();

  const book = document.createElement("div");
  book.className = "book";

  const title = document.createElement("h3");
  title.textContent = entry.name;

  const p = document.createElement("p");
  p.style.whiteSpace = "pre-line";
  p.textContent = entry.message || "남겨진 메시지가 없습니다.";

  book.append(title, p);
  $("modalContent").append(book);

  addButton("방명록으로 돌아가기", renderGuestbook);
}

function renderGuestForm() {
  clearModal();

  const book = document.createElement("div");
  book.className = "book";

  const title = document.createElement("h3");
  title.textContent = "방명록에 기록 남기기";

  const form = document.createElement("form");

  const name = document.createElement("input");
  name.placeholder = "이름 (최대 12자, 필수)";
  name.maxLength = 12;
  name.required = true;

  const message = document.createElement("textarea");
  message.placeholder = "메시지 (최대 50자, 선택)";
  message.maxLength = 50;

  const submit = document.createElement("button");
  submit.className = "btn";
  submit.type = "submit";
  submit.textContent = "기록 남기기";

  form.append(name, message, submit);
  book.append(title, form);
  $("modalContent").append(book);

  form.onsubmit = event => {
    event.preventDefault();

    const guestName = name.value.trim();
    if (!guestName) {
      $("modalStatus").textContent = "이름을 입력해 주세요.";
      return;
    }

    const entries = getEntries();
    entries.push({
      name: guestName.slice(0, 12),
      message: message.value.trim().slice(0, 50),
      date: new Date().toISOString()
    });

    if (saveEntries(entries)) {
      guestPage = Math.floor((entries.length - 1) / PAGE_SIZE);
      renderGuestbook();
    } else {
      $("modalStatus").textContent =
        "저장하지 못했습니다. 브라우저 저장 설정을 확인해 주세요.";
    }
  };

  addButton("방명록으로 돌아가기", renderGuestbook);
}
