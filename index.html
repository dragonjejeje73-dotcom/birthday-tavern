
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이세계 술집의 비밀 전시관</title>
  <style>
    body {
      margin: 0;
      background: #211810;
      color: #f5dfb4;
      font-family: sans-serif;
      text-align: center;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    button {
      background: #80522c;
      color: white;
      border: 1px solid #d5a66d;
      border-radius: 8px;
      padding: 15px 30px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>🍷 이세계 술집의 비밀 전시관</h1>
    <p>오늘은 특별한 손님을 위해 문을 엽니다.</p>
    <button onclick="enter()">입장하기</button>
  </main>

  <script>
    function enter() {
      alert("어서 오세요! 전시관은 현재 준비 중입니다.");
    }
  </script>
</body>
</html>
