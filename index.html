
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이세계 술집의 비밀 전시관</title>
  <style>
    body {
      margin: 0;
      background: #241a14;
      color: #f8e7c4;
      font-family: sans-serif;
      text-align: center;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      box-sizing: border-box;
    }

    .exhibit {
      padding: 25px;
      border: 3px solid #c99b56;
      background: #503522;
      border-radius: 10px;
      cursor: pointer;
    }

    .exhibit:hover {
      background: #725035;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #39271c;
      border: 2px solid #d7ab69;
      border-radius: 12px;
      padding: 30px;
      max-width: 400px;
    }

    button {
      background: #9a683c;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 24px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>🍷 이세계 술집의 비밀 전시관</h1>
    <p>전시물을 클릭해 보세요.</p>

    <div class="exhibit" onclick="openExhibit()">
      🖼️<h2>첫 번째 전시물</h2>
    </div>
  </main>

  <div class="modal" id="exhibitModal">
    <div class="modal-content">
      <h2>📜 어느 날 도착한 편지</h2>
      <p>
        이곳에는 수많은 이야기가 오고 갑니다.
        어떤 이야기는 웃음을 남기고,
        어떤 이야기는 마음에 오래 남습니다.
      </p>
      <button onclick="closeExhibit()">닫기</button>
    </div>
  </div>

  <script>
    function openExhibit() {
      document.getElementById("exhibitModal").style.display = "flex";
    }

    function closeExhibit() {
      document.getElementById("exhibitModal").style.display = "none";
    }
  </script>
</body>
</html>
