
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>달그늘 — 이름 없는 전시관</title>

<style>
:root {
  --gold: #d9b77e;
  --cream: #f8edd9;
  --dark: #17121b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--dark);
  color: var(--cream);
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}

button {
  cursor: pointer;
  font: inherit;
}

button:focus-visible {
  outline: 3px solid #ffe6a6;
  outline-offset: 3px;
}

.hidden { display: none !important; }

.screen {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 18px;
}

.eyebrow {
  color: var(--gold);
  font-size: 12px;
  letter-spacing: .25em;
}

.btn {
  padding: 12px 22px;
  color: var(--cream);
  background: #34262a;
  border: 1px solid var(--gold);
  border-radius: 7px;
  transition: background .2s;
}

.btn:hover { background: #614536; }

.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.muted {
  color: #d1baa0;
  font-size: 13px;
  text-align: center;
}

/* 프롤로그 */

#prologue {
  background:
    radial-gradient(circle at 50% 20%, #503a3e, #120e15 75%);
}

.scene-art {
  width: min(1100px, 100%);
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border: 1px solid #967552;
  border-radius: 10px;
  box-shadow: 0 20px 65px #0009;
}

.scene-art img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: fadeScene .8s ease;
}

@keyframes fadeScene {
  from { opacity: .2; transform: scale(1.03); }
  to { opacity: 1; transform: scale(1); }
}

.dialogue {
  width: min(900px, 100%);
  min-height: 130px;
  padding: 24px;
  display: grid;
  place-items: center;
  text-align: center;
  white-space: pre-line;
  line-height: 2;
  background: #261d23;
  border: 1px solid #816348;
  border-radius: 9px;
  font-size: clamp(15px, 2vw, 19px);
}

/* 전시관 */

#museum {
  background: #100f17;
}

.museum-frame {
  width: min(1200px, 100%);
  position: relative;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border: 1px solid #aa916b;
  border-radius: 10px;
}

.museum-frame > img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
}

.hotspot {
  position: absolute;
  transform: translate(-50%, -50%);
  min-width: 95px;
  padding: 10px;
  color: #fff2d7;
  background: #19151dcc;
  border: 1px solid #e8c68b;
  border-radius: 9px;
  box-shadow: 0 0 20px #f1c27c55;
  backdrop-filter: blur(3px);
  transition: background .2s, box-shadow .2s;
  z-index: 2;
}

.hotspot:hover {
  background: #6c4a38;
  box-shadow: 0 0 30px #ffd28a99;
}

.hotspot span {
  display: block;
  font-size: 22px;
  margin-bottom: 4px;
}

/* 앞쪽 전시대 */
.hotspot.invite {
  left: 13%;
  top: 74%;
}

.hotspot.gift {
  left: 87%;
  top: 74%;
}

/* 뒤쪽 전시대 */
.hotspot.hourglass {
  left: 27%;
  top: 47%;
}

.hotspot.guestbook {
  left: 73%;
  top: 47%;
}

/* 중앙 문 */
.hotspot.finale {
  left: 50%;
  top: 25%;
}

/* 팝업 */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: #08070deb;
}

.modal {
  position: relative;
  width: min(850px, 100%);
  max-height: 94dvh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  padding: 20px;
  background: #241d25;
  border: 1px solid var(--gold);
  border-radius: 12px;
  box-shadow: 0 20px 80px #000b;
}

.modal h2 {
  margin: 0;
  text-align: center;
  color: #f0d3a2;
}

.modal p {
  line-height: 1.8;
  text-align: center;
}

.modal-image {
  display: block;
  width: min(650px, 100%);
  max-height: 60vh;
  object-fit: contain;
  border-radius: 7px;
}

.close {
  align-self: flex-end;
  padding: 8px 13px;
  background: transparent;
  border: 1px solid #aa906d;
  border-radius: 6px;
  color: white;
}

/* 초대장 */

.invitation-stage {
  position: relative;
  width: min(540px, 100%);
}

.invitation-stage > img {
  display: block;
  width: 100%;
  height: auto;
}

.letter-paper {
  position: absolute;
  left: 12%;
  right: 12%;
  top: 14%;
  bottom: 20%;
  overflow-y: auto;
  padding: 18px;
  color: #4c3629;
  background: #fff7e9f2;
  border: 1px solid #c4a16e;
  border-radius: 4px;
  scrollbar-width: thin;
}

.letter-paper h3 {
  margin: 0 0 18px;
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 30px;
  color: #9a743e;
  text-align: center;
}

.letter-paper p {
  font-family: "Nanum Myeongjo", "Batang", serif;
  font-size: 14px;
  line-height: 2;
  margin: 0 0 20px;
  word-break: keep-all;
}

.ink {
  opacity: 0;
  filter: blur(4px);
  transform: translateY(5px);
  transition: opacity 1s, filter 1s, transform 1s;
}

.ink.visible {
  opacity: 1;
  filter: none;
  transform: none;
}

/* 선물 상자 */

.gift-stage {
  position: relative;
  width: min(740px, 100%);
}

.gift-stage img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 8px;
}

.gift-object {
  position: absolute;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 12px;
}

.gift-object:hover,
.gift-object:focus-visible {
  background: #ffe4a51b;
  border-color: #ffda94;
  box-shadow: 0 0 25px #f3c87988;
}

.gift-coins {
  left: 19%;
  top: 27%;
  width: 29%;
  height: 48%;
}

.gift-letter {
  left: 47%;
  top: 30%;
  width: 31%;
  height: 43%;
}

.gift-detail {
  width: min(620px, 100%);
  padding: 30px 22px;
  color: #493527;
  background: #f8eedc;
  border: 3px double #b99865;
  border-radius: 8px;
  text-align: center;
}

.gift-detail h3 {
  color: #825e32;
}

.gift-detail p {
  white-space: pre-line;
  font-family: "Batang", serif;
}

/* 임시 전시 */

.placeholder {
  width: min(650px, 100%);
  padding: 35px 20px;
  border: 1px solid #8b7353;
  border-radius: 8px;
  text-align: center;
  background: #30252c;
}

@media (max-width: 650px) {
  .screen { padding: 10px; }

  .scene-art { aspect-ratio: 4 / 3; }

  .dialogue {
    min-height: 170px;
    padding: 15px;
  }

  .hotspot {
    min-width: 0;
    padding: 5px;
    font-size: 10px;
  }

  .hotspot span {
    font-size: 16px;
  }

  .letter-paper {
    left: 10%;
    right: 10%;
    top: 12%;
    bottom: 18%;
    padding: 10px;
  }

  .letter-paper p {
    font-size: 12px;
    line-height: 1.7;
  }

  .modal { padding: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  .scene-art img { animation: none; }
  .ink { transition: none; }
}
</style>
</head>

<body>

<!-- 프롤로그 -->
<main id="prologue" class="screen">
  <div class="eyebrow">DALGEUNEUL · PROLOGUE</div>

  <div class="scene-art">
    <img
      id="sceneImage"
      src="images/prologue_01.png"
      alt="오두막 침실"
    >
  </div>

  <div class="dialogue" id="dialogue"></div>

  <div class="muted" id="sceneCounter">1 / 7</div>

  <div class="actions">
    <button class="btn" id="prevScene">← 이전</button>
    <button class="btn" id="nextScene">다음 →</button>
  </div>
</main>

<!-- 전시관 -->
<section id="museum" class="screen hidden">
  <div class="eyebrow">SECRET EXHIBITION</div>
  <h1>이름 없는 전시관</h1>

  <div class="museum-frame">
    <img src="museum.png" alt="비밀 전시관">

    <button class="hotspot invite" data-exhibit="invite">
      <span>✉</span>초대장
    </button>

    <button class="hotspot gift" data-exhibit="gift">
      <span>🎁</span>선물 상자
    </button>

    <button class="hotspot hourglass" data-exhibit="hourglass">
      <span>⌛</span>모래시계
    </button>

    <button class="hotspot guestbook" data-exhibit="guestbook">
      <span>✒</span>방명록
    </button>

    <button class="hotspot finale" data-exhibit="finale">
      <span>✦</span>마지막 문
    </button>
  </div>

  <p class="muted">
    전시대 위의 물건을 선택해 주세요.
  </p>

  <button class="btn" id="returnPrologue">
    ← 창고 문 앞으로
  </button>
</section>

<!-- 전시물 팝업 -->
<div id="overlay" class="overlay hidden">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >
    <button class="close" id="closeModal">✕ 닫기</button>

    <div class="eyebrow" id="modalBadge"></div>
    <h2 id="modalTitle"></h2>

    <div id="modalContent" style="width:100%;display:flex;
      flex-direction:column;align-items:center;gap:15px">
    </div>

    <div class="actions" id="modalActions"></div>
    <div class="muted" id="modalStatus"></div>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

/* ========================================
   1. 프롤로그 7장면
======================================== */

const prologueScenes = [
  {
    image: "images/prologue_01.png",
    alt: "오두막 침실",
    text:
      "눈을 뜨자 익숙한 나무 천장이 보인다.\n" +
      "창밖에서는 새들이 아침을 알리고 있다.\n" +
      "…오늘도 평범한 하루의 시작이다."
  },
  {
    image: "images/prologue_02.png",
    alt: "신비로운 숲길",
    text:
      "오두막을 나와 숲길에 들어섰다.\n" +
      "나뭇잎 사이로 아침 햇살이 흘러내린다.\n" +
      "오늘따라 숲이 조금 더 신비롭게 느껴진다."
  },
  {
    image: "images/prologue_03.png",
    alt: "달그늘 술집 외관",
    text:
      "익숙한 길 끝에 따뜻한 불빛이 보인다.\n" +
      "달과 별이 새겨진 간판, 「달그늘」.\n" +
      "언제나처럼 그곳이 나를 기다리고 있다."
  },
  {
    image: "images/prologue_04.png",
    alt: "달그늘 술집 입구",
    text:
      "낡은 나무문 앞에 멈춰 섰다.\n" +
      "안쪽에서 희미한 온기와 나무 향이 전해진다.\n" +
      "자, 오늘도 문을 열어 볼까."
  },
  {
    image: "images/prologue_05.png",
    alt: "달그늘 술집 내부",
    text:
      "익숙한 술집의 풍경이 눈앞에 펼쳐진다.\n" +
      "창가의 햇살, 정돈된 바, 조용한 테이블들.\n" +
      "그런데… 저 안쪽이 원래 저랬던가?"
  },
  {
    image: "images/prologue_06.png",
    alt: "창고 문을 향해 다가가는 모습",
    text:
      "무심코 안쪽으로 발걸음을 옮겼다.\n" +
      "초록색 좌석 옆, 오래된 나무문 하나가 눈에 들어온다.\n" +
      "분명 익숙한 곳인데, 어쩐지 낯설다."
  },
  {
    image: "images/prologue_07.png",
    alt: "낡은 창고 문",
    text:
      "문 앞에 서자 발걸음이 멎는다.\n" +
      "오래된 나뭇결과 녹슨 손잡이.\n" +
      "…이 문 너머에는 무엇이 있을까?"
  }
];

let sceneIndex = 0;

function showScreen(id) {
  $("prologue").classList.toggle(
    "hidden", id !== "prologue"
  );
  $("museum").classList.toggle(
    "hidden", id !== "museum"
  );
  window.scrollTo(0, 0);
}

function renderScene() {
  const scene = prologueScenes[sceneIndex];

  $("sceneImage").src = scene.image;
  $("sceneImage").alt = scene.alt;

  $("dialogue").textContent = scene.text;

  $("sceneCounter").textContent =
    `${sceneIndex + 1} / ${prologueScenes.length}`;

  $("prevScene").disabled = sceneIndex === 0;

  $("nextScene").textContent =
    sceneIndex === 6
      ? "창고 문 열기 →"
      : "다음 →";
}

$("nextScene").addEventListener("click", () => {
  if (sceneIndex < 6) {
    sceneIndex++;
    renderScene();
  } else {
    showScreen("museum");
  }
});

$("prevScene").addEventListener("click", () => {
  if (sceneIndex > 0) {
    sceneIndex--;
    renderScene();
  }
});

$("returnPrologue").addEventListener("click", () => {
  sceneIndex = 6;
  renderScene();
  showScreen("prologue");
});

/* ========================================
   2. 전시관 공통 기능
======================================== */

let inkTimers = [];

function clearInkTimers() {
  inkTimers.forEach(clearTimeout);
  inkTimers = [];
}

function createButton(text, callback) {
  const button = document.createElement("button");
  button.className = "btn";
  button.textContent = text;
  button.addEventListener("click", callback);
  $("modalActions").append(button);
}

function clearModal() {
  clearInkTimers();
  $("modalContent").replaceChildren();
  $("modalActions").replaceChildren();
  $("modalStatus").textContent = "";
}

function closeModal() {
  clearInkTimers();
  $("overlay").classList.add("hidden");
}

function openExhibit(type) {
  clearModal();
  $("overlay").classList.remove("hidden");

  const titles = {
    invite: ["EXHIBIT 01", "수상한 초대장"],
    gift: ["EXHIBIT 02", "주인장을 위한 선물 상자"],
    hourglass: ["EXHIBIT 03", "운세 모래시계"],
    guestbook: ["EXHIBIT 04", "방명록"],
    finale: ["FINALE", "마지막 문"]
  };

  $("modalBadge").textContent = titles[type][0];
  $("modalTitle").textContent = titles[type][1];

  if (type === "invite") {
    renderInvitationClosed();
  } else if (type === "gift") {
    renderGiftClosed();
  } else {
    renderPlaceholder(type);
  }
}

document.querySelectorAll("[data-exhibit]").forEach(button => {
  button.addEventListener("click", () => {
    openExhibit(button.dataset.exhibit);
  });
});

$("closeModal").addEventListener("click", closeModal);

$("overlay").addEventListener("click", event => {
  if (event.target === $("overlay")) closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closeModal();
    return;
  }

  if (!$("overlay").classList.contains("hidden")) return;
  if ($("prologue").classList.contains("hidden")) return;

  if (event.key === "ArrowRight") {
    $("nextScene").click();
  }

  if (event.key === "ArrowLeft") {
    $("prevScene").click();
  }
});

/* ========================================
   3. 초대장
======================================== */

const invitationText = [
  "친애하는 주인장께.",

  "먼저, 이곳에 도착하신 것을 환영합니다.",

  "평범한 창고 문 너머에 이런 공간이 있을 줄은 예상하지 못하셨겠지요.",

  "혹시 잘못 들어오신 건 아닌지 걱정하고 계신다면, 안심하셔도 좋습니다.",

  "이곳은 처음부터 당신을 기다리고 있었으니까요.",

  "그동안 이 술집에서는 수많은 손님이 문을 열고 들어왔겠지요.",

  "하지만 오늘은 조금 다릅니다.",

  "이번에는 주인장께서 손님이 되어 주셔야겠습니다.",

  "이곳에는 당신을 위해 준비한 몇 가지 작은 전시물이 있습니다.",

  "그중에는 쓸모 있는 것도, 쓸모없는 것도 있을지 모릅니다. 물론 어느 쪽인지는 저희도 장담할 수 없습니다.",

  "다만 한 가지는 약속드리겠습니다.",

  "이 모든 것은 오직 당신을 위해 준비되었습니다.",

  "그러니 너무 서두르지 마시고, 마음이 이끄는 대로 천천히 둘러봐 주세요.",

  "그리고 마지막 문에 도착하셨을 때, 이 초대장의 진짜 의미를 알게 되실 겁니다.",

  "— 이름 없는 전시관의 안내인으로부터 —"
];

function renderInvitationClosed() {
  clearModal();

  const img = document.createElement("img");
  img.src = "invitation_closed.png";
  img.alt = "검정색과 금색의 닫힌 초대장";
  img.className = "modal-image";

  $("modalContent").append(img);

  const p = document.createElement("p");
  p.textContent =
    "검은색 표지 위로 금색 글씨가 반짝인다.";

  $("modalContent").append(p);

  createButton("초대장 펼치기", renderInvitationOpen);
  createButton("전시관으로 돌아가기", closeModal);
}

function renderInvitationOpen() {
  clearModal();

  const stage = document.createElement("div");
  stage.className = "invitation-stage";

  const img = document.createElement("img");
  img.src = "invitation_open.png";
  img.alt = "펼쳐진 초대장";

  const paper = document.createElement("div");
  paper.className = "letter-paper";

  const heading = document.createElement("h3");
  heading.textContent = "Invitatio";
  paper.append(heading);

  invitationText.forEach((text, index) => {
    const p = document.createElement("p");
    p.className = "ink";
    p.textContent = text;
    paper.append(p);

    inkTimers.push(setTimeout(() => {
      p.classList.add("visible");
    }, 250 + index * 650));
  });

  stage.append(img, paper);
  $("modalContent").append(stage);

  $("modalStatus").textContent =
    "편지 안쪽을 스크롤하면 이어지는 내용을 읽을 수 있습니다.";

  createButton("글씨 모두 보기", () => {
    clearInkTimers();

    paper.querySelectorAll(".ink").forEach(p => {
      p.classList.add("visible");
    });
  });

  createButton("다시 접기", renderInvitationClosed);
  createButton("전시관으로 돌아가기", closeModal);
}

/* ========================================
   4. 선물 상자
======================================== */

function makeImage(filename, alt) {
  const img = document.createElement("img");
  img.src = filename;
  img.alt = alt;
  return img;
}

function renderGiftClosed() {
  clearModal();

  const stage = document.createElement("div");
  stage.className = "gift-stage";

  stage.append(
    makeImage(
      "gift_closed.png",
      "금색 리본과 노란 장미로 장식된 선물 상자"
    )
  );

  $("modalContent").append(stage);

  const p = document.createElement("p");
  p.textContent =
    "전시대 위에 정성스럽게 포장된 상자가 놓여 있다.";

  $("modalContent").append(p);

  createButton("상자 열기", renderGiftOpen);
  createButton("전시관으로 돌아가기", closeModal);
}

function renderGiftOpen() {
  clearModal();

  const stage = document.createElement("div");
  stage.className = "gift-stage";

  stage.append(
    makeImage(
      "gift_contents.png",
      "열린 선물 상자 안에 금화 주머니와 편지가 놓여 있다"
    )
  );

  const coins = document.createElement("button");
  coins.className = "gift-object gift-coins";
  coins.type = "button";
  coins.setAttribute(
    "aria-label",
    "금화 주머니 살펴보기"
  );
  coins.addEventListener("click", renderGiftCoins);

  const letter = document.createElement("button");
  letter.className = "gift-object gift-letter";
  letter.type = "button";
  letter.setAttribute(
    "aria-label",
    "봉인된 편지 읽기"
  );
  letter.addEventListener("click", renderGiftLetter);

  stage.append(coins, letter);
  $("modalContent").append(stage);

  const p = document.createElement("p");
  p.textContent =
    "상자 안에는 두 가지 물건이 있다. 무엇부터 살펴볼까?";

  $("modalContent").append(p);

  $("modalStatus").textContent =
    "왼쪽 주머니 또는 오른쪽 편지를 클릭해 주세요.";

  createButton("상자 닫기", renderGiftClosed);
  createButton("전시관으로 돌아가기", closeModal);
}

function renderGiftCoins() {
  clearModal();

  const card = document.createElement("div");
  card.className = "gift-detail";

  const title = document.createElement("h3");
  title.textContent = "주인장께 드리는 금화";

  const text = document.createElement("p");
  text.textContent =
    "작은 주머니 안에 금화가 반짝이고 있다.\n" +
    "오늘만큼은 이 보물이 주인장의 것이기를.";

  const note = document.createElement("p");
  note.textContent =
    "※ 실제 선물은 방송에서 별도로 전달됩니다.";

  card.append(title, text, note);
  $("modalContent").append(card);

  createButton("상자로 돌아가기", renderGiftOpen);
  createButton("전시관으로 돌아가기", closeModal);
}

function renderGiftLetter() {
  clearModal();

  const card = document.createElement("div");
  card.className = "gift-detail";

  const title = document.createElement("h3");
  title.textContent = "주인장께 드리는 편지";
  card.append(title);

  const paragraphs = [
    "친애하는 주인장께.",
    "이 작은 상자에 담긴 마음이 조금이나마 전해지기를 바랍니다.",
    "언제나 주인장다운 모습으로, 하고 싶은 이야기를 마음껏 이어가 주세요.",
    "— 당신을 응원하는 어느 손님으로부터 —"
  ];

  paragraphs.forEach((text, index) => {
    const p = document.createElement("p");
    p.className = "ink";
    p.textContent = text;
    card.append(p);

    inkTimers.push(setTimeout(() => {
      p.classList.add("visible");
    }, 300 + index * 850));
  });

  $("modalContent").append(card);

  $("modalStatus").textContent =
    "편지 내용은 임시 문구이며 나중에 교체할 수 있습니다.";

  createButton("상자로 돌아가기", renderGiftOpen);
  createButton("전시관으로 돌아가기", closeModal);
}

/* ========================================
   5. 아직 작업 중인 전시물
======================================== */

function renderPlaceholder(type) {
  const messages = {
    hourglass:
      "모래시계가 조용히 빛나고 있다.\n" +
      "이 안에는 조금 이상한 운세들이 잠들어 있는 듯하다.\n\n" +
      "운세 뽑기 기능은 다음 단계에서 추가됩니다.",

    guestbook:
      "오래된 책 한 권이 전시대 위에 펼쳐져 있다.\n" +
      "이곳을 방문한 손님들의 이름이 적힐 자리다.\n\n" +
      "공동 방명록 저장 기능은 아직 연결되지 않았습니다.",

    finale:
      "검정색 문 위로 금빛 문양이 빛난다.\n" +
      "이 문 너머에는 무엇이 기다리고 있을까?\n\n" +
      "마지막 축하 공간은 다음 단계에서 연결됩니다."
  };

  const box = document.createElement("div");
  box.className = "placeholder";

  const p = document.createElement("p");
  p.style.whiteSpace = "pre-line";
  p.textContent = messages[type];

  box.append(p);
  $("modalContent").append(box);

  createButton("전시관으로 돌아가기", closeModal);
}

/* ========================================
   6. 시작
======================================== */

renderScene();

</script>
