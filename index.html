!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>주인장을 위한 비밀 전시관</title>
<style>
:root{--gold:#d5b47c;--ink:#151319;--cream:#f5ebd9}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#141118;color:var(--cream);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,[role=button]:focus-visible{outline:3px solid #ffe7ad;outline-offset:4px}.hidden{display:none!important}.scene{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;gap:15px}.eyebrow{font-size:12px;letter-spacing:.3em;color:var(--gold)}.btn{background:#2a2224;border:1px solid var(--gold);color:var(--cream);border-radius:9px;padding:11px 21px}.btn:hover{background:#493831}.muted{color:#d5c7b6;font-size:14px}.art{position:relative;width:min(980px,100%);aspect-ratio:16/9;overflow:hidden;border-radius:12px;border:1px solid #816c55;background:#201a20}.art img{width:100%;height:100%;object-fit:cover;display:block;animation:zoom 14s ease-out both}@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.04)}}.story{width:min(820px,100%);background:#2a2224;border:1px solid #816c55;border-radius:12px;padding:20px;min-height:112px;display:grid;place-items:center;text-align:center;line-height:1.85;white-space:pre-line}.story p{margin:0}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}#tavern{background:radial-gradient(circle at 50% 28%,#6b4935,#251a1a 68%,#100d12)}.door-label{border:1px solid #b18b5b;background:#4b3026;padding:7px 28px}.door-frame{height:280px;width:185px;border:10px ridge #9b7248;background:#0b0a10;perspective:750px;cursor:pointer}.door{width:100%;height:100%;position:relative;background:repeating-linear-gradient(90deg,#6c452c 0 28px,#4a2d20 30px 35px,#865737 36px 60px);transform-origin:left;transition:transform 1.2s ease}.door.open{transform:rotateY(-78deg)}.door:before,.door:after{content:'';position:absolute;left:13%;width:74%;height:33%;border:3px solid #422719;box-shadow:inset 0 0 0 2px #ae8150}.door:before{top:7%}.door:after{bottom:7%}.knob{position:absolute;right:10px;top:49%;background:#e7c477;border:2px solid #7b5729;border-radius:50%;width:17px;height:17px}
#museum{padding:15px 12px 20px;gap:10px;background:#0c0c12}.museum-frame{position:relative;width:min(1200px,100%);aspect-ratio:3/2;border:1px solid #8d7d6e;border-radius:10px;overflow:hidden;box-shadow:0 15px 60px #0008;background:#27242a}.museum-frame>img{display:block;width:100%;height:100%;object-fit:fill}.museum-frame:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#0b0a12aa 0%,transparent 22%)}.hotspot{position:absolute;z-index:2;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;border:1px solid #f4dbab9c;background:#18131bbd;color:#fff1ce;box-shadow:0 0 16px #e6b66c55;border-radius:11px;padding:8px 10px;transform:translate(-50%,-50%);min-width:100px;transition:background .2s,scale .2s;backdrop-filter:blur(2px)}.hotspot:hover{background:#5a403b;scale:1.04}.hotspot .symbol{font-size:24px}.hotspot small{font-size:11px;color:#f2d9ad}.hotspot.invite{left:17%;top:72%}.hotspot.gift{left:82%;top:72%}.hotspot.hourglass{left:30%;top:40%}.hotspot.guestbook{left:70%;top:40%}.hotspot.finale{left:50%;top:23%;background:#1d1a21d9;border-color:#a79579}.museum-caption{max-width:1100px;text-align:center;color:#e8d9bf;font-size:14px;line-height:1.6}
.overlay{position:fixed;inset:0;z-index:10;background:#0b0910ed;display:flex;justify-content:center;align-items:center;padding:18px}.modal{position:relative;width:min(850px,100%);max-height:94vh;overflow:auto;border:1px solid #a78c65;background:#201a20;border-radius:14px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 10px 65px #000b}.modal h2{font-size:clamp(19px,3vw,26px);margin:0;color:#f3d7a4}.modal p{line-height:1.7;text-align:center;margin:0}.invitation-photo{display:block;max-width:100%;max-height:58vh;object-fit:contain;border-radius:7px}.close{align-self:flex-end;background:transparent;color:white;border:1px solid #9c896f;border-radius:7px;padding:6px 13px}.status{font-size:12px;color:#d7c4a6}.badge{font-size:12px;border:1px solid #a58b68;padding:5px 12px;border-radius:30px;color:#e6d2b3}@media(max-width:650px){.art{aspect-ratio:4/3}.art img{object-position:center}.scene{padding:13px}.hotspot{min-width:0;padding:5px;font-size:11px;border-radius:7px}.hotspot .symbol{font-size:16px}.hotspot small{font-size:9px}.museum-frame{aspect-ratio:3/2}.modal{padding:12px}.invitation-photo{max-height:53vh}}@media(prefers-reduced-motion:reduce){.art img{animation:none}.door{transition:none}}

/* Invitation: readable hand-lettered text layered over the open invitation artwork */
.invitation-stage{position:relative;width:min(520px,100%);flex:none;overflow:hidden;border-radius:8px}
.invitation-stage>img{width:100%;height:auto;display:block}
.invitation-letter{position:absolute;left:12%;right:12%;top:15%;bottom:22%;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#a88a61 transparent;background:rgba(255,248,235,.94);border:1px solid #c7a97a;border-radius:4px;padding:clamp(10px,2.7vw,23px) clamp(9px,2vw,19px);color:#4c382b;text-align:center;box-shadow:0 1px 18px #4c2e2526}
.invitation-letter h3{font-family:'Brush Script MT','Segoe Script',cursive;font-size:clamp(27px,5vw,39px);font-style:italic;font-weight:400;color:#956f38;margin:0 0 4px}
.invitation-letter .letter-rule{color:#b18a53;font-size:12px;letter-spacing:.25em;margin-bottom:16px}
.invitation-letter p{font-family:'Nanum Myeongjo','Batang','AppleMyungjo',serif!important;font-size:clamp(12px,2.25vw,15px);line-height:1.95!important;word-break:keep-all;overflow-wrap:break-word;margin:0 0 18px!important;text-align:center!important;white-space:normal}
.invitation-letter .letter-sign{font-style:italic;color:#8b6b43;margin-top:24px!important}
.invitation-letter .ink-line{opacity:0;filter:blur(3px);transform:translateY(4px);transition:opacity 1.25s ease,filter 1.4s ease,transform 1.25s ease}
.invitation-letter .ink-line.revealed{opacity:1;filter:blur(0);transform:translateY(0)}
.invitation-letter .ink-line strong{color:#7d5731;font-weight:700}
.invitation-stage.is-closed{width:min(420px,100%)}
.invitation-stage.is-closed .invitation-letter{display:none}
.invitation-hint{font-size:12px;color:#dbc8a6;text-align:center}
@media(max-width:650px){.invitation-stage{width:min(430px,100%)}.invitation-letter{left:10%;right:10%;top:13%;bottom:20%;padding:10px}.invitation-letter p{font-size:12px;line-height:1.7!important;margin-bottom:14px!important}}
@media(prefers-reduced-motion:reduce){.invitation-letter .ink-line{transition:none;filter:none;transform:none}}

/* Gift exhibit: image-driven interaction, no fantasy-game UI plaques */
.gift-stage{width:min(740px,100%);position:relative;flex:none}
.gift-stage img{display:block;width:100%;height:auto;border-radius:8px}
.gift-stage .gift-object{position:absolute;border:1px solid transparent;background:transparent;border-radius:18px;color:transparent;transition:background .25s,border-color .25s,box-shadow .25s;cursor:pointer}
.gift-stage .gift-object:hover,.gift-stage .gift-object:focus-visible{border-color:#ffdf9eaa;background:#ffe4a516;box-shadow:0 0 24px #f5c77b55;color:#fff}
.gift-stage .gift-coins{left:19%;top:27%;width:29%;height:48%}
.gift-stage .gift-letter{left:47%;top:30%;width:31%;height:43%}
.gift-object span{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;text-shadow:0 2px 5px #000}
.gift-note{max-width:620px;text-align:center;font-size:14px;color:#e7d5b7;line-height:1.75}
.gift-detail{width:min(620px,100%);padding:25px 22px;background:linear-gradient(145deg,#f9f1df,#e8d8bb);color:#45342b;border:2px solid #c6a26c;border-radius:8px;text-align:center;box-shadow:inset 0 0 0 5px #f8eddb,0 12px 40px #0006}
.gift-detail h3{font-family:Georgia,'Batang',serif;color:#7b592d;font-size:24px;margin:8px 0 18px}
.gift-detail p{font-family:'Nanum Myeongjo','Batang',serif;color:#513e2e;line-height:2!important;margin:13px 0!important;white-space:pre-line}
.coin-emblem{margin:12px auto 18px;width:120px;height:120px;border-radius:50%;border:8px double #8d5e1e;background:radial-gradient(circle at 28% 25%,#fff3b1,#f6c65c 46%,#b8751f 85%);box-shadow:inset 0 0 0 5px #e8af43,0 8px 22px #a16d2866;display:grid;place-items:center;font-size:57px;color:#87541b}
.gift-ink{opacity:0;filter:blur(4px);transition:opacity 1.5s,filter 1.5s}.gift-ink.visible{opacity:1;filter:none}
@media(max-width:650px){.gift-stage .gift-object{border-radius:8px}.gift-object span{font-size:11px}.gift-detail{padding:17px 12px}}
@media(prefers-reduced-motion:reduce){.gift-ink{transition:none}}

/* Tavern approach sequence */
.tavern-art{aspect-ratio:16/9;cursor:pointer}.tavern-art img{animation:none;object-fit:fill}.tavern-click{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;cursor:pointer}.tavern-click:hover{background:#f9d89b09}.door-fade{position:absolute;inset:0;background:#09070b;opacity:0;pointer-events:none;transition:opacity .85s ease}.door-fade.active{opacity:1}.tavern-art:focus-within{outline:2px solid #ffe2a5}.tavern-art img{transition:filter .4s}.tavern-art.transitioning img{filter:brightness(.4)}
</style></head><body>
<section id="prologue" class="scene"><div class="eyebrow">PROLOGUE</div><div class="art"><img id="prologueImage" src="prologue.png" alt="술집으로 향하는 주인장"></div><div class="story"><p id="storyText" aria-live="polite"></p></div><div class="muted" id="storyCount"></div><div class="actions"><button class="btn" id="storyNext">다음 이야기 →</button><button class="btn" id="skipStory">술집 내부로 건너뛰기</button></div></section>
<section id="tavern" class="scene hidden"><div class="eyebrow">THE WIND & HEARTH TAVERN</div><h1 id="tavernTitle">익숙한 술집</h1><div class="art tavern-art"><img id="tavernImage" src="prologue4.png" alt="익숙한 술집 내부, 오른쪽 안쪽에 나무 문이 보인다"><button class="tavern-click" id="tavernClick" aria-label="안쪽 창고 문으로 다가가기"></button><div id="doorFade" class="door-fade" aria-hidden="true"></div></div><div class="story"><p id="tavernText">익숙한 술집 안쪽에, 낯선 문이 하나 보인다.\n저런 문이 원래 있었던가?</p></div><div class="actions"><button class="btn" id="tavernNext">안쪽 문으로 다가가기 →</button><button class="btn" id="backStory">프롤로그로 돌아가기</button></div></section>
<section id="museum" class="scene hidden"><div class="eyebrow">SECRET BIRTHDAY EXHIBITION</div><h1 style="margin:0;font-size:clamp(20px,4vw,32px)">비밀 전시관</h1><div class="museum-frame"><img src="museum.png" alt="흰색 대리석과 검은색 장식이 어우러진 비밀 전시관, 네 개의 전시대와 정면 문"><button class="hotspot invite" data-exhibit="invite"><span class="symbol">✉</span><span>① 초대장</span><small>가까운 왼쪽</small></button><button class="hotspot gift" data-exhibit="gift"><span class="symbol">🎁</span><span>② 선물 상자</span><small>가까운 오른쪽</small></button><button class="hotspot hourglass" data-exhibit="hourglass"><span class="symbol">⌛</span><span>③ 모래시계</span><small>안쪽 왼쪽</small></button><button class="hotspot guestbook" data-exhibit="guestbook"><span class="symbol">📖</span><span>④ 방명록</span><small>안쪽 오른쪽</small></button><button class="hotspot finale" data-exhibit="finale"><span class="symbol">✦</span><span>마지막 문</span></button></div><div class="museum-caption">전시대를 눌러 살펴보세요. 초대장과 선물 상자를 살펴볼 수 있어요. 다른 전시물은 제작 중입니다.</div><button class="btn" id="backTavern">창고 문으로 돌아가기</button></section>
<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><button class="close" id="closeModal" aria-label="닫기">✕ 닫기</button><div class="badge" id="modalBadge">EXHIBIT 01</div><h2 id="modalTitle">수상한 초대장</h2><div id="invitationStage" class="invitation-stage is-closed hidden"><img id="invitationPhoto" src="invitation_closed.png" alt="검정색과 금색의 닫힌 초대장"><div id="invitationLetter" class="invitation-letter hidden" aria-label="초대장 내용"></div></div><div id="giftArea" class="hidden"></div><p id="modalDescription"></p><div class="actions" id="modalActions"></div><div class="status" id="modalStatus"></div></div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);const scenes=['prologue','tavern','museum'];
const lines=[
{img:'prologue.png',text:'수많은 세계가 존재하는 어딘가.\n그곳에는 작은 술집 하나가 있었다.'},
{img:'prologue.png',text:'오늘도 그 술집의 주인은\n여느 때처럼 가게로 향하고 있었다.'},
{img:'prologue2.png',text:'익숙한 간판, 익숙한 불빛.\n어느새 술집의 문 앞에 도착했다.'},
{img:'prologue3.png',text:'주인은 손을 뻗어 문고리를 잡았다.'},
{img:'prologue3.png',text:'끼이익—\n익숙한 술집 문이 천천히 열린다.'},
{img:'prologue4.png',text:'늘 보던 술집 안쪽 풍경이 눈앞에 펼쳐진다.'}
];
// prologue4.png는 술집 내부 1인칭 시점입니다.
let storyIndex=0,opening=false,modalType='',inviteOpened=false;const seen=new Set();
function scene(name){for(const id of scenes)$(id).classList.toggle('hidden',id!==name);window.scrollTo(0,0)}
function renderStory(){const s=lines[storyIndex];$('prologueImage').src=s.img;$('storyText').textContent=s.text;$('storyCount').textContent=`${storyIndex+1} / ${lines.length}`;$('storyNext').textContent=storyIndex===lines.length-1?'술집 안으로 →':'다음 이야기 →'}
$('storyNext').addEventListener('click',()=>{if(storyIndex<lines.length-1){storyIndex++;renderStory()}else {tavernStep=0;renderTavern();scene('tavern')}});$('skipStory').addEventListener('click',()=>{tavernStep=0;renderTavern();scene('tavern')});$('backStory').addEventListener('click',()=>scene('prologue'));
let tavernStep=0,doorBusy=false;
const tavernViews=[
 {img:'prologue4.png',title:'익숙한 술집',text:'늘 보던 술집 안쪽 풍경이다.\n그런데 오른쪽 구석에 저런 문이 있었던가?',button:'안쪽 문으로 다가가기 →'},
 {img:'storage_door1.png',title:'낯선 창고 문',text:'평범한 나무 문이다.\n오래된 손잡이와 낡은 나뭇결이 눈에 들어온다.',button:'조금 더 가까이 →'},
 {img:'storage_door2.png',title:'오래된 창고 문',text:'문틈에는 먼지가 쌓여 있고, 손잡이에는 녹이 슬어 있다.\n이 문 너머에는 무엇이 있을까?',button:'문 열기 →'}
];
function renderTavern(){const v=tavernViews[tavernStep];$('tavernImage').src=v.img;$('tavernTitle').textContent=v.title;$('tavernText').textContent=v.text;$('tavernNext').textContent=v.button;$('tavernClick').setAttribute('aria-label',v.button)}
function tavernAdvance(){if(doorBusy)return;if(tavernStep<2){tavernStep++;renderTavern();return}doorBusy=true;$('tavernNext').disabled=true;$('tavernText').textContent='끼이익……\n문 너머에서 낯선 빛이 번진다.';$('doorFade').classList.add('active');setTimeout(()=>{scene('museum');$('doorFade').classList.remove('active');$('tavernNext').disabled=false;doorBusy=false},950)}
$('tavernClick').addEventListener('click',tavernAdvance);$('tavernNext').addEventListener('click',tavernAdvance);
$('backTavern').addEventListener('click',()=>{tavernStep=2;renderTavern();scene('tavern')});
renderTavern();
function makeButton(label,fn){const b=document.createElement('button');b.className='btn';b.textContent=label;b.addEventListener('click',fn);$('modalActions').append(b)}
function openExhibit(type){modalType=type;$('overlay').classList.remove('hidden');$('modalActions').replaceChildren();$('invitationStage').classList.add('hidden');$('giftArea').classList.add('hidden');$('giftArea').replaceChildren();stopInk();$('modalStatus').textContent='';const info={invite:['EXHIBIT 01','수상한 초대장'],gift:['EXHIBIT 02','주인장을 위한 선물 상자'],hourglass:['EXHIBIT 03','미래를 점치는 모래시계'],guestbook:['EXHIBIT 04','끝나지 않는 방명록'],finale:['FINALE','오늘의 주인공']};$('modalBadge').textContent=info[type][0];$('modalTitle').textContent=info[type][1];if(type==='invite'){renderInvitation();return}if(type==='gift'){renderGiftClosed();return}const desc={gift:'선물 상자와 개인 편지를 선택할 수 있는 전시를 준비하고 있어요. 실제 선물은 방송 중 직접 전달할 예정입니다.',hourglass:'장난스러운 예언과 따뜻한 응원이 담길 모래시계 전시를 준비하고 있어요.',guestbook:'방문자가 이름과 짧은 축하 메시지를 남기고, 나중에도 다시 볼 수 있는 공동 방명록을 준비하고 있어요. 현재는 저장 기능이 연결되지 않았습니다.',finale:'마지막 생일 축하 공간은 아직 제작 중이에요. 네 개의 전시가 완성되면 이 문 뒤에 연결할 예정입니다.'};$('modalDescription').textContent=desc[type];$('modalStatus').textContent='이 전시물은 현재 준비 중입니다.';makeButton('전시관으로 돌아가기',closeModal)}
const invitationParagraphs=[
'친애하는 주인장께.',
'먼저, 이곳에 도착하신 것을 환영합니다. 평범한 창고 문 너머에 이런 공간이 있을 줄은 예상하지 못하셨겠지요.',
'혹시 잘못 들어오신 건 아닌지 걱정하고 계신다면, 안심하셔도 좋습니다. 이곳은 처음부터 당신을 기다리고 있었으니까요.',
'그동안 이 술집에서는 수많은 손님이 문을 열고 들어왔겠지요. 하지만 오늘은 조금 다릅니다.',
'이번에는 주인장께서 손님이 되어 주셔야겠습니다.',
'이곳에는 당신을 위해 준비한 몇 가지 작은 전시물이 있습니다. 그중에는 쓸모 있는 것도, 쓸모없는 것도 있을지 모릅니다. 물론 어느 쪽인지는 저희도 장담할 수 없습니다.',
'다만 한 가지는 약속드리겠습니다. 이 모든 것은 오직 당신을 위해 준비되었습니다.',
'그러니 너무 서두르지 마시고, 마음이 이끄는 대로 천천히 둘러봐 주세요. 그리고 마지막 문에 도착하셨을 때, 이 초대장의 진짜 의미를 알게 되실 겁니다.',
'— 이름 없는 전시관의 안내인으로부터 —'
];
let inkTimers=[];
function stopInk(){inkTimers.forEach(clearTimeout);inkTimers=[]}
function revealAllInk(){stopInk();document.querySelectorAll('#invitationLetter .ink-line').forEach(p=>p.classList.add('revealed'));$('modalStatus').textContent='편지를 끝까지 읽으려면 초대장 안쪽을 스크롤해 주세요.'}
function showOpenInvitation(){
  stopInk();inviteOpened=true;seen.add('invite');
  $('invitationStage').classList.remove('is-closed');
  $('invitationPhoto').src='invitation_open.png';$('invitationPhoto').alt='펼쳐진 고풍스러운 초대장';
  const paper=$('invitationLetter');paper.replaceChildren();paper.classList.remove('hidden');paper.scrollTop=0;
  const title=document.createElement('h3');title.textContent='Invitatio';paper.append(title);
  const ornament=document.createElement('div');ornament.className='letter-rule';ornament.textContent='✦ ─── ✦ ─── ✦';paper.append(ornament);
  invitationParagraphs.forEach((line,i)=>{const para=document.createElement('p');para.className='ink-line'+(i===invitationParagraphs.length-1?' letter-sign':'');para.textContent=line;paper.append(para)});
  $('modalDescription').textContent='편지 위에 잉크가 천천히 스며들기 시작한다.';
  $('modalActions').replaceChildren();makeButton('글씨 한 번에 보기',revealAllInk);makeButton('다시 접기',renderInvitation);makeButton('전시관으로 돌아가기',closeModal);
  $('modalStatus').textContent='초대장 안쪽을 스크롤하면 이어지는 내용을 읽을 수 있어요.';
  const paras=[...paper.querySelectorAll('.ink-line')];
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){revealAllInk();return}
  paras.forEach((para,i)=>inkTimers.push(setTimeout(()=>{para.classList.add('revealed');if(i===paras.length-1)$('modalStatus').textContent='편지가 모두 나타났습니다.'},350+i*1050)));
}
function renderInvitation(){
  stopInk();inviteOpened=false;
  $('invitationStage').classList.remove('hidden');$('invitationStage').classList.add('is-closed');
  $('invitationLetter').classList.add('hidden');
  $('invitationPhoto').src='invitation_closed.png';$('invitationPhoto').alt='금색 필기체 Invitatio가 적힌 닫힌 검은색 초대장';
  $('modalDescription').textContent='검은색 표지에 금색 글씨가 빛난다. 누군가 이곳에 초대장을 남겨 두었다.';
  $('modalActions').replaceChildren();makeButton('초대장 펼쳐 보기',showOpenInvitation);
  $('modalStatus').textContent='';
}

// Gift: closed box -> open box -> two clickable objects -> individual scenes.
function giftImage(file,alt){const img=document.createElement('img');img.src=file;img.alt=alt;return img}
function giftButton(label,callback){makeButton(label,callback)}
function giftReset(){const a=$('giftArea');a.classList.remove('hidden');a.replaceChildren();$('modalActions').replaceChildren();$('modalStatus').textContent=''}
function renderGiftClosed(){
 giftReset();const stage=document.createElement('div');stage.className='gift-stage';stage.append(giftImage('gift_closed.png','금빛 리본과 노란 장미로 장식한 닫힌 검은 선물 상자'));$('giftArea').append(stage);
 $('modalDescription').textContent='전시대 위에 정성스럽게 포장된 상자가 놓여 있다.';
 giftButton('상자 열어 보기',renderGiftOpen);giftButton('전시관으로 돌아가기',closeModal);
}
function renderGiftOpen(){
 giftReset();seen.add('gift');const stage=document.createElement('div');stage.className='gift-stage';stage.append(giftImage('gift_contents.png','열린 상자 안 왼쪽에는 금화 주머니, 오른쪽에는 봉인된 편지가 놓여 있다'));
 const coins=document.createElement('button');coins.type='button';coins.className='gift-object gift-coins';coins.setAttribute('aria-label','금화 주머니 살펴보기');coins.innerHTML='<span>금화 주머니</span>';coins.addEventListener('click',renderGiftCoins);
 const letter=document.createElement('button');letter.type='button';letter.className='gift-object gift-letter';letter.setAttribute('aria-label','봉인된 편지 읽기');letter.innerHTML='<span>봉인된 편지</span>';letter.addEventListener('click',renderGiftLetter);
 stage.append(coins,letter);$('giftArea').append(stage);
 $('modalDescription').textContent='상자 안에는 두 가지 물건이 놓여 있다. 무엇부터 살펴볼까?';
 giftButton('상자 다시 닫기',renderGiftClosed);giftButton('전시관으로 돌아가기',closeModal);
 $('modalStatus').textContent='금화 주머니 또는 편지를 직접 클릭해 보세요.';
}
function renderGiftCoins(){
 giftReset();const card=document.createElement('div');card.className='gift-detail';card.innerHTML='<div class="coin-emblem" aria-hidden="true">✿</div><h3>주인장께 드리는 금화</h3><p>작은 주머니에 담긴 금화들이 따뜻하게 반짝인다.\n오늘만큼은 이 보물이 주인장의 것이기를.</p><p style="font-size:13px;color:#826744">이 금화는 실제 선물을 상징하는 전시 연출입니다.</p>';
 $('giftArea').append(card);$('modalDescription').textContent='';$('modalStatus').textContent='실제 선물은 방송에서 별도로 전달됩니다. 이 사이트에서 자동 전송되지는 않아요.';
 giftButton('상자 안으로 돌아가기',renderGiftOpen);giftButton('전시관으로 돌아가기',closeModal);
}
function renderGiftLetter(){
 giftReset();const card=document.createElement('div');card.className='gift-detail';
 const heading=document.createElement('h3');heading.textContent='주인장께 드리는 편지';card.append(heading);
 const texts=['친애하는 주인장께.','이 작은 상자에 담긴 마음이 조금이나마 전해지기를 바랍니다.','언제나 주인장다운 모습으로, 하고 싶은 이야기를 마음껏 이어가 주세요.','— 당신을 응원하는 어느 손님으로부터 —'];
 texts.forEach((s,i)=>{const p=document.createElement('p');p.className='gift-ink';p.textContent=s;card.append(p);inkTimers.push(setTimeout(()=>p.classList.add('visible'),250+i*1000))});
 $('giftArea').append(card);$('modalDescription').textContent='봉인된 편지를 펼치자 잉크가 천천히 드러난다.';
 $('modalStatus').textContent='편지 내용은 임시 문구입니다. 나중에 원하는 내용으로 교체할 수 있어요.';
 giftButton('상자 안으로 돌아가기',()=>{stopInk();renderGiftOpen()});giftButton('전시관으로 돌아가기',closeModal);
}

function closeModal(){stopInk();$('overlay').classList.add('hidden');modalType=''}document.querySelectorAll('[data-exhibit]').forEach(b=>b.addEventListener('click',()=>openExhibit(b.dataset.exhibit)));$('closeModal').addEventListener('click',closeModal);$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').classList.contains('hidden'))closeModal()});renderStory();
</script></body></html>
