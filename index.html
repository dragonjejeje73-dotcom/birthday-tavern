
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>달그늘 — 프롤로그</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #100e13;
      color: #f6e9d7;
      font-family: Georgia, "Malgun Gothic", serif;
    }

    button { font: inherit; cursor: pointer; }

    .screen {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: radial-gradient(ellipse at center, #342735, #100e13 75%);
    }

    .stage {
      width: min(1200px, 100%);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #d8b88e;
      font-size: 12px;
      letter-spacing: .16em;
    }

    .art {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid #81624e;
      border-radius: 7px;
      background: #2a2324;
      box-shadow: 0 15px 65px #0009;
    }

    .art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: arrive 1.3s ease-out both;
    }

    .art::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(transparent 64%, #160f13a0);
    }

    @keyframes arrive {
      from { opacity: .3; transform: scale(1.045); }
      to { opacity: 1; transform: scale(1); }
    }

    .story {
      min-height: 142px;
      border: 1px solid #76563c;
      border-radius: 7px;
      background: linear-gradient(135deg, #31221def, #20181a);
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .story p {
      margin: 0;
      white-space: pre-line;
      line-height: 2;
      font-size: clamp(15px, 1.8vw, 19px);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .actions button, .gallery button {
      padding: 12px 20px;
      border: 1px solid #ac8457;
      background: #563923;
      color: #fff0d5;
      border-radius: 5px;
    }

    .actions button:hover,
    .actions button:focus-visible {
      background: #805335;
      outline: 2px solid #e3bb80;
      outline-offset: 2px;
    }

    .actions button:disabled {
      opacity: .35;
      cursor: default;
    }

    .hint {
      font-size: 12px;
      color: #b99b80;
      text-align: center;
    }

    .hidden { display: none !important; }

    .gallery {
      max-width: 750px;
      text-align: center;
      border: 1px solid #b38a5b;
      padding: 50px 24px;
      background: #241b20;
    }

    .gallery h1 {
      color: #f0d8aa;
      font-size: clamp(26px, 5vw, 46px);
    }

    .gallery p { line-height: 2; }

    @media (max-width: 600px) {
      .screen { padding: 10px; }
      .story { min-height: 175px; padding: 16px; }
      .art { aspect-ratio: 4 / 3; }
      .actions button { padding: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .art img { animation: none; }
    }
  </style>
</head>

<body>
  <main id="prologue" class="screen">
    <div class="stage">
      <div class="top">
        <span>DALGEUNEUL · PROLOGUE</span>
        <span id="counter">01 / 07</span>
      </div>

      <div class="art">
        <img
          id="sceneImage"
          src="images/prologue_01.png"
          alt="오두막 침실에서 눈을 뜬 장면"
        >
      </div>

      <div class="story">
        <p id="storyText" aria-live="polite"></p>
      </div>

      <div class="actions">
        <button id="prev" type="button">← 이전</button>
        <button id="next" type="button">다음 →</button>
      </div>

      <div class="hint">
        대사를 읽고 다음을 눌러 이동하세요.
        키보드 ← → 도 사용할 수 있습니다.
      </div>
    </div>
  </main>

  <section id="gallery" class="screen hidden">
    <div class="gallery">
      <div style="letter-spacing:.2em;color:#cda878">
        SECRET EXHIBITION
      </div>

      <h1>이름 없는 전시관</h1>

      <p>
        끼이익—<br>
        낡은 창고 문이 열리자,<br>
        예상하지 못한 공간이 모습을 드러냈다.<br>
        이곳은 대체…?
      </p>

      <p style="font-size:13px;color:#bda78d">
        이곳에 기존 비밀 전시관을 연결할 예정입니다.
      </p>

      <button id="back" type="button">
        ← 창고 문 앞으로
      </button>
    </div>
  </section>

  <script>
    const scenes = [
      {
        image: "images/prologue_01.png",
        alt: "아침 햇살이 들어오는 오두막 침실",
        text:
          "눈을 뜨자 익숙한 나무 천장이 보인다.\n" +
          "창밖에서는 새들이 아침을 알리고 있다.\n" +
          "…오늘도 평범한 하루의 시작이다."
      },
      {
        image: "images/prologue_02.png",
        alt: "신비로운 숲길",
        text:
          "오두막을 나와 숲길에 들어섰다.\n" +
          "나뭇잎 사이로 아침 햇살이 흘러내린다.\n" +
          "오늘따라 숲이 조금 더 신비롭게 느껴진다."
      },
      {
        image: "images/prologue_03.png",
        alt: "달그늘 술집 외관",
        text:
          "익숙한 길 끝에 따뜻한 불빛이 보인다.\n" +
          "달과 별이 새겨진 간판, 「달그늘」.\n" +
          "언제나처럼 그곳이 나를 기다리고 있다."
      },
      {
        image: "images/prologue_04.png",
        alt: "달그늘 술집 입구",
        text:
          "낡은 나무문 앞에 멈춰 섰다.\n" +
          "안쪽에서 희미한 온기와 나무 향이 전해진다.\n" +
          "자, 오늘도 문을 열어 볼까."
      },
      {
        image: "images/prologue_05.png",
        alt: "달그늘 술집 내부",
        text:
          "익숙한 술집의 풍경이 눈앞에 펼쳐진다.\n" +
          "창가의 햇살, 정돈된 바, 조용한 테이블들.\n" +
          "그런데… 저 안쪽이 원래 저랬던가?"
      },
      {
        image: "images/prologue_06.png",
        alt: "창고 문을 향해 다가가는 모습",
        text:
          "무심코 안쪽으로 발걸음을 옮겼다.\n" +
          "초록색 좌석 옆, 오래된 나무문 하나가 눈에 들어온다.\n" +
          "분명 익숙한 곳인데, 어쩐지 낯설다."
      },
      {
        image: "images/prologue_07.png",
        alt: "낡은 창고 문 바로 앞",
        text:
          "문 앞에 서자 발걸음이 멎는다.\n" +
          "오래된 나뭇결과 녹슨 손잡이.\n" +
          "…이 문 너머에는 무엇이 있을까?"
      }
    ];

    let index = 0;

    const $ = id => document.getElementById(id);

    function render() {
      const scene = scenes[index];
      const img = $("sceneImage");

      img.src = scene.image;
      img.alt = scene.alt;

      img.style.animation = "none";
      void img.offsetWidth;
      img.style.animation = "";

      $("storyText").textContent = scene.text;
      $("counter").textContent =
        String(index + 1).padStart(2, "0") + " / 07";

      $("prev").disabled = index === 0;
      $("next").textContent =
        index === 6 ? "창고 문 열기 →" : "다음 →";
    }

    function next() {
      if (index < scenes.length - 1) {
        index++;
        render();
      } else {
        $("prologue").classList.add("hidden");
        $("gallery").classList.remove("hidden");
      }
    }

    function prev() {
      if (index > 0) {
        index--;
        render();
      }
    }

    $("next").addEventListener("click", next);
    $("prev").addEventListener("click", prev);

    $("back").addEventListener("click", () => {
      $("gallery").classList.add("hidden");
      $("prologue").classList.remove("hidden");
      render();
    });

    document.addEventListener("keydown", event => {
      if (!$("gallery").classList.contains("hidden")) return;

      if (event.key === "ArrowRight") next();
      if (event.key === "ArrowLeft") prev();
    });

    render();
  </script>
</body>
</html>
