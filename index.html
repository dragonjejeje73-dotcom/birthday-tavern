
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이세계 술집의 비밀 전시관</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #21180f;
  color: #f4dfb9;
  font-family: sans-serif;
  text-align: center;
}

.scene {
  min-height: 100vh;
  padding: 35px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
}

.hidden { display: none; }

h1 { margin: 0; }

.door-frame {
  width: 185px;
  height: 290px;
  padding: 8px;
  background: #3b2415;
  border: 6px solid #9d6a3c;
  border-radius: 8px 8px 2px 2px;
  perspective: 700px;
  cursor: pointer;
}

.door {
  position: relative;
  width: 100%;
  height: 100%;
  background: repeating-linear-gradient(
    90deg,
    #704523 0px,
    #8e5d34 26px,
    #5b371e 29px,
    #704523 32px
  );
  border: 3px solid #ad7845;
  transform-origin: left center;
  transition: transform 1.2s ease;
}

.door.open {
  transform: rotateY(-78deg);
}

.handle {
  position: absolute;
  right: 12px;
  top: 49%;
  width: 13px;
  height: 13px;
  background: #d5ac65;
  border-radius: 50%;
  border: 2px solid #63401f;
}

.sign {
  background: #684323;
  border: 2px solid #c49a61;
  padding: 7px 22px;
  border-radius: 4px;
}

button {
  padding: 12px 22px;
  background: #82552e;
  border: 1px solid #d5ab6c;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}

button:hover { background: #a06e3b; }

#gallery {
  background: radial-gradient(
    ellipse at center,
    #654529,
    #21180f
  );
}
</style>
</head>

<body>

<section class="scene" id="tavern">
  <h1>🍷 어느 이세계의 술집</h1>
  <p>술집 뒤편에 낡은 창고 문이 보인다.</p>

  <div class="sign">창고</div>

  <div class="door-frame"
       onclick="openDoor()"
       role="button"
       tabindex="0"
       aria-label="창고 문 열기"
       onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDoor();}">
    <div class="door" id="door">
      <div class="handle"></div>
    </div>
  </div>

  <p id="message">문을 클릭해 보세요.</p>
</section>

<section class="scene hidden" id="gallery">
  <h1>🖼️ 비밀 전시관</h1>
  <p>오래된 창고 문 너머에는...</p>
  <h2>당신을 위한 작은 전시관이 있었다.</h2>
  <p>전시관은 현재 준비 중입니다.</p>
  <button onclick="goBack()">술집으로 돌아가기</button>
</section>

<script>
let moving = false;

function openDoor() {
  if (moving) return;
  moving = true;

  document.getElementById("door").classList.add("open");
  document.getElementById("message").textContent =
    "끼이익... 문이 천천히 열린다.";

  setTimeout(() => {
    document.getElementById("tavern").classList.add("hidden");
    document.getElementById("gallery").classList.remove("hidden");
    moving = false;
  }, 1300);
}

function goBack() {
  document.getElementById("gallery").classList.add("hidden");
  document.getElementById("tavern").classList.remove("hidden");
  document.getElementById("door").classList.remove("open");
  document.getElementById("message").textContent =
    "문을 클릭해 보세요.";
}
</script>

</body>
</html>
